<!doctype html>
<meta charset="utf-8">
<title>Export game data for Godot</title>
<!-- Loads a browser game in a hidden frame and prints its content tables (creatures, moves, maps, story...) as JSON,
     base64-encoded inside <pre id="out">, so tools/godot-export.ps1 can save it for the Godot version.
     Usage: godot-export.html?game=wildbond  (open it yourself to see a readable copy and a download button). -->
<style>body{font:14px system-ui;margin:16px}pre{white-space:pre-wrap;word-break:break-all;max-height:40vh;overflow:auto;background:#f4f0e6;padding:8px}</style>
<h1>Export game data for Godot</h1>
<p id="status">Loading the game…</p>
<button id="dl" hidden>Download JSON</button>
<pre id="readable"></pre>
<pre id="out" hidden></pre>
<iframe id="game" style="width:10px;height:10px;opacity:0" aria-hidden="true"></iframe>
<script>
'use strict';
// The content tables each game shares with its Godot version. Only data: anything that is code is left out.
const TABLES = {
  wildbond: ['BATTLE_LESSONS', 'VERSION', 'SPECIES', 'MOVES', 'ELEMENTS', 'STARTERS', 'COUNTER', 'HYBRIDS', 'VARIANTS', 'BADGES', 'MAPS', 'TILES',
    'BIOMES', 'WEATHER', 'WEATHER_NAME', 'SCENES', 'STORY', 'CAST', 'RIVAL', 'WREN_SPOT', 'SPIRE_LINES', 'SPIRE_REGULARS',
    'BATTLE_PLACES', 'FOODS', 'REGIMENS', 'FAVORITE', 'JOURNEY', 'CAP_TABLE', 'LEVEL_CAP', 'MODES', 'ERAS', 'RANCH_PENNANTS',
    'STORY_NAMES', 'MORE_NAMES', 'STAT_HELP', 'PLAYER_LOOK', 'BARN', 'TRAIN_CAP', 'BREED_COST', 'DAY_SECONDS'],
};
const game = new URLSearchParams(location.search).get('game') || 'wildbond';
const frame = document.getElementById('game');
frame.src = `../games/${game}/`;
frame.onload = () => setTimeout(() => {
  const w = frame.contentWindow, data = { game, exported: new Date().toISOString().slice(0, 10) }, missing = [];
  let dropped = 0;
  const plain = v => JSON.parse(JSON.stringify(v, (k, x) => { if (typeof x === 'function') { dropped++; return undefined; } return x; }));
  for (const n of TABLES[game] || []) {
    try { data[n] = plain(w.eval(n)); } catch (e) { missing.push(n); }
  }
  const json = JSON.stringify(data);
  document.getElementById('out').textContent = btoa(unescape(encodeURIComponent(json)));
  document.getElementById('readable').textContent = JSON.stringify(data, null, 1).slice(0, 20000);
  document.getElementById('status').textContent = `${game}: ${Object.keys(data).length - 2} tables, ${json.length} characters` +
    (missing.length ? `; missing: ${missing.join(', ')}` : '') + (dropped ? `; ${dropped} code values left out` : '') + '.';
  const b = document.getElementById('dl'); b.hidden = false;
  b.onclick = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' })); a.download = game + '.json'; a.click(); };
  document.body.dataset.done = '1';
}, 300);
</script>
