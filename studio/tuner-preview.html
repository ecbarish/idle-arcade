<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Light preview</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{width:100%;height:100%;display:block;image-rendering:pixelated}</style></head>
<body><canvas id="c" width="400" height="225"></canvas>
<script src="../shared/light.js"></script>
<script>
'use strict';
/* The Studio tuner's preview (E7): a small outdoor scene drawn with the arcade's light engine, the way the games use it
   (Realmbound 23-light.js realmAtmosphere, Wildbond 06-scene.js wbAtmosphere). The Studio calls show(params). */
const cv = document.getElementById('c'), cx = cv.getContext('2d'), W = cv.width, H = cv.height, GY = H * .78;
const LT = Light.create({ reduce: () => matchMedia('(prefers-reduced-motion: reduce)').matches, quality: 'high' });
let P = { air: { fog: .15, col: '#e0e6ea' }, fog: .15, shadow: 1, grade: 1, t: .12 };
window.show = p => { P = Object.assign({}, P, p); };
const tree = (g, x, s) => { g.fillStyle = '#4a3020'; g.fillRect(x - 2 * s, GY - 14 * s, 4 * s, 14 * s); g.fillStyle = '#2f6a34';
  g.beginPath(); g.moveTo(x, GY - 34 * s); g.lineTo(x + 11 * s, GY - 12 * s); g.lineTo(x - 11 * s, GY - 12 * s); g.fill(); };
const person = (g, x) => { g.fillStyle = '#e8c8a0'; g.fillRect(x - 3, GY - 30, 6, 6); g.fillStyle = '#3858a0'; g.fillRect(x - 4, GY - 24, 8, 14); g.fillStyle = '#2a2030'; g.fillRect(x - 4, GY - 10, 3, 10); g.fillRect(x + 1, GY - 10, 3, 10); };
const house = (g, x) => { g.fillStyle = '#b89870'; g.fillRect(x - 20, GY - 26, 40, 26); g.fillStyle = '#8a3a2a'; g.beginPath(); g.moveTo(x - 24, GY - 26); g.lineTo(x, GY - 44); g.lineTo(x + 24, GY - 26); g.fill(); g.fillStyle = '#ffd890'; g.fillRect(x - 5, GY - 14, 10, 14); };
const PROPS = [[g => tree(g, 60, 1.3), [44, GY - 46, 32, 46]], [g => house(g, 150), [124, GY - 46, 52, 46]], [g => person(g, 230), [224, GY - 31, 12, 31]], [g => tree(g, 330, 1), [318, GY - 35, 24, 35]]];
function frame(ms) {
  const t = ms / 1000, a = P.air || {}, ground = a.bounceGround || '#4a6a3a';
  const st = LT.time(P.t, { sky: a.bounceSky, ground });
  const sky = cx.createLinearGradient(0, 0, 0, GY); sky.addColorStop(0, Light.css(Light.mix('#5a8ad0', '#0a1028', st.day ? 0 : .85)));
  sky.addColorStop(1, Light.css(Light.mix(st.day ? '#cfe0f0' : '#2a3460', st.light, .25))); cx.fillStyle = sky; cx.fillRect(0, 0, W, GY);
  cx.fillStyle = Light.css(Light.mix(ground, '#000', st.day ? 0 : .6)); cx.fillRect(0, GY, W, H - GY);
  for (const [draw, box] of PROPS) LT.cast(cx, draw, box, GY, st, { k: P.shadow });
  for (const [draw] of PROPS) draw(cx);
  LT.fog(cx, W, H, t, { ground: GY + H * .05, top: H * (a.fogTop === undefined ? .3 : a.fogTop), density: P.fog,
    col: Light.css(Light.mix(a.col || '#e0e6ea', a.night || a.nightCol || '#1a2040', st.day ? 0 : .55)), lights: st.day ? [] : [{ x: 150, y: GY - 8, r: 40, col: '#ffc860' }] });
  LT.grade(cx, W, H, st, { tint: a.tint, amount: P.grade });
  LT.shafts(cx, W, H, t, st, { strength: a.shafts === undefined ? .9 + P.fog : a.shafts });
  window.__frames = (window.__frames || 0) + 1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></body></html>
