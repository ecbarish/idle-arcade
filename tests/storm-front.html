<!doctype html><html lang="en"><meta charset="utf-8"><title>Storm Front checks</title><style>body{font:16px system-ui;background:#102c31;color:#f2eedb;padding:20px}.pass{color:#9ee7ba}.fail{color:#ffaaa6}button{min-height:44px}iframe{width:375px;height:812px;border:0}</style><h1>Storm Front checks</h1><button id="run">Run checks</button><p id="summary">Ready.</p><ol id="results"></ol><div id="game"></div><script>
'use strict';
document.querySelector('#run').onclick=async()=>{const sum=document.querySelector('#summary'),list=document.querySelector('#results'),button=document.querySelector('#run');button.disabled=true;list.replaceChildren();sum.textContent='Running…';let frame;const managed=k=>k==='storm-front-save-v1'||k==='arcade-index-v1'||k==='arcade-settings-v1'||k.startsWith('arcade-backup:storm-front-save-v1:')||k.startsWith('arcade-backup:arcade-index-v1:');const backup=new Map(Object.keys(localStorage).filter(managed).map(k=>[k,localStorage.getItem(k)]));let n=0;
const check=(name,ok)=>{n++;const li=document.createElement('li');li.className=ok?'pass':'fail';li.textContent=(ok?'PASS — ':'FAIL — ')+name;list.appendChild(li);if(!ok)throw Error(name);};const wait=()=>new Promise(r=>setTimeout(r,120));
try{Object.keys(localStorage).filter(managed).forEach(k=>localStorage.removeItem(k));frame=document.createElement('iframe');frame.title='Storm Front test instance';frame.src='../games/storm-front/index.html';await new Promise((r,j)=>{const timer=setTimeout(()=>j(Error('load timed out')),20000);frame.onload=()=>{clearTimeout(timer);r();};document.querySelector('#game').appendChild(frame);});const w=frame.contentWindow,d=w.document,H=w.__storm,M=H.M;check('local test hook and original demo',!!H&&H.state===null);await wait();check('demo never creates a score save',localStorage.getItem('storm-front-save-v1')===null);
d.querySelector('[data-start="2"]').click();check('two-player start creates independent turns',H.state.players.length===2&&H.state.phase==='ready');d.querySelector('[data-launch]').click();check('start focuses active game',d.activeElement===d.querySelector('#sea')&&d.querySelector('#curtain').hidden);
let x=M.current(H.state).x;d.querySelector('#sea').dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));await wait();d.querySelector('#sea').dispatchEvent(new w.KeyboardEvent('keyup',{key:'ArrowRight',bubbles:true}));check('keyboard actually moves lighthouse',M.current(H.state).x>x);
const fire=d.querySelector('[data-hold="fire"]');fire.dispatchEvent(new w.PointerEvent('pointerdown',{pointerId:8,bubbles:true}));await wait();fire.dispatchEvent(new w.PointerEvent('pointerup',{pointerId:8,bubbles:true}));check('touch actually fires beam',M.current(H.state).shots.length>0);H.pause();x=M.current(H.state).x;await wait();check('pause freezes model',M.current(H.state).x===x&&H.state.paused);d.querySelector('[data-resume]').click();check('resume clears pause',!H.state.paused);
H.state.players[0].score=240;M.hurt(H.state,true);await wait();check('second player waits behind ready screen',H.state.active===1&&H.state.phase==='ready'&&!d.querySelector('#curtain').hidden);d.querySelector('[data-launch]').click();H.state.players[1].score=100;M.hurt(H.state,true);await wait();check('first finished score asks for initials',!!d.querySelector('#initials'));d.querySelector('#initials').value='ABC';d.querySelector('#initialForm').requestSubmit();check('second score has separate initials',!!d.querySelector('#initials'));d.querySelector('#initials').value='XYZ';d.querySelector('#initialForm').requestSubmit();const saved=JSON.parse(localStorage.getItem('storm-front-save-v1'));check('both scores saved in rank order',saved.scores.length===2&&saved.scores[0].name==='ABC'&&saved.scores[0].score===240&&saved.scores[1].name==='XYZ');check('finished run cannot submit twice',!d.querySelector('#initialForm'));
for(const [width,height]of [[320,568],[375,812],[667,375],[1366,768],[1920,1080],[3440,1440]]){frame.style.width=width+'px';frame.style.height=height+'px';H.title();await wait();check(width+'×'+height+' no document overflow',d.documentElement.scrollWidth<=width&&d.documentElement.scrollHeight<=height);check(width+'×'+height+' playable world fills available screen',d.querySelector('#sea').getBoundingClientRect().height>150);check(width+'×'+height+' touch targets stay 44px',Array.from(d.querySelectorAll('[data-hold]')).every(b=>b.getBoundingClientRect().height>=44));}
frame.style.width='375px';frame.style.height='812px';d.documentElement.style.setProperty('--arc-text','1.3');H.title();await wait();check('larger text stays inside phone',d.documentElement.scrollWidth<=375&&d.querySelector('#panel').scrollWidth<=d.querySelector('#panel').clientWidth);check('high scores reject markup and unsafe numbers',M.scores([{name:'<x>',score:9},{name:'AAA',score:Infinity}]).length===0);H.title();const pad={connected:true,axes:[0,0],buttons:Array.from({length:16},()=>({pressed:false}))};const prior=w.navigator.getGamepads.bind(w.navigator);w.navigator.getGamepads=()=>[pad];pad.buttons[9].pressed=true;await wait();pad.buttons[9].pressed=false;await wait();check('gamepad starts from title menu',H.state&&H.state.phase==='ready');pad.buttons[9].pressed=true;await wait();pad.buttons[9].pressed=false;await wait();check('gamepad launches without keyboard',H.state.phase==='playing');const before=M.current(H.state).x;pad.axes[0]=1;pad.buttons[0].pressed=true;await wait();pad.axes[0]=0;pad.buttons[0].pressed=false;check('gamepad moves and fires',M.current(H.state).x>before&&M.current(H.state).shots.length>0);pad.buttons[9].pressed=true;await wait();pad.buttons[9].pressed=false;await wait();check('gamepad pauses',H.state.paused);pad.buttons[9].pressed=true;await wait();pad.buttons[9].pressed=false;await wait();check('gamepad resumes',!H.state.paused);w.navigator.getGamepads=prior;sum.textContent='PASS — '+n+' checks.';
}catch(e){sum.textContent='FAIL — '+e.message;}finally{if(frame)frame.remove();Object.keys(localStorage).filter(managed).forEach(k=>localStorage.removeItem(k));for(const[k,v]of backup)localStorage.setItem(k,v);button.disabled=false;}};
</script></html>
