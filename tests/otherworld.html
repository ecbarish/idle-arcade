<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Otherworld checks</title>
<style>body{font:15px system-ui;background:#14122a;color:#eee;max-width:980px;margin:24px auto;padding:0 16px}.pass{color:#8be0a6}.fail{color:#ffaba7}#game{width:640px;height:360px;opacity:.3}</style>
<h1>Otherworld checks</h1><p>Loads the game in a frame, checks every path through every built world, and restores your save afterwards.</p>
<button id="run">Run checks</button><p id="summary">Ready.</p><ol id="results"></ol><div id="game"></div>
<script src="otherworld-checks.js"></script>
<script>
document.querySelector('#run').addEventListener('click', async () => {
  const keys = ['otherworld-save-v1', 'arcade-index-v1'], backup = new Map(keys.map(k => [k, localStorage.getItem(k)]));
  const res = document.querySelector('#results'), sum = document.querySelector('#summary'); res.innerHTML = ''; sum.textContent = 'Running…';
  let frame;
  try {
    localStorage.removeItem('otherworld-save-v1');
    frame = document.createElement('iframe'); frame.style.cssText = 'width:640px;height:360px;border:0';
    await new Promise(r => { frame.onload = r; frame.src = '../games/otherworld/'; document.querySelector('#game').appendChild(frame); });
    const w = frame.contentWindow; if (!w.__ow) throw Error('test hook missing');
    const list = w.eval('(' + otherworldChecks.toString() + ')()');
    let fail = 0; for (const c of list) { const li = document.createElement('li'); li.className = c.ok ? 'pass' : 'fail'; li.textContent = (c.ok ? 'PASS — ' : 'FAIL — ') + c.label; res.appendChild(li); if (!c.ok) fail++; }
    sum.textContent = fail ? `FAIL — ${fail} of ${list.length} failed.` : `PASS — ${list.length} checks.`;
  } catch (e) { sum.textContent = 'FAIL — ' + e.message; }
  finally { if (frame) frame.remove(); for (const [k, v] of backup) { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } }
});
</script></html>
