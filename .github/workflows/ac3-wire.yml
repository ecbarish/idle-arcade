name: ac3 wire
on:
  push:
    paths:
      - tools/ac3_wire.py
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: guest/briskets-crossing
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 tools/ac3_wire.py
      - name: commit the wiring and remove this helper
        run: |
          git config user.name abarish-dev
          git config user.email "319211409+abarish-dev@users.noreply.github.com"
          git add tools/run-all-checks.cjs tests/tell-us.html launcher/games.js index.html .github/ISSUE_TEMPLATE/bug.yml .github/ISSUE_TEMPLATE/feedback.yml .github/ISSUE_TEMPLATE/suggestion.yml
          git commit -m "AC3: link Brisket's Crossing from the arcade"
          git push
          git rm tools/ac3_wire.py .github/workflows/ac3-wire.yml
          git commit -m "AC3: remove the one-shot wiring helper"
          git push
