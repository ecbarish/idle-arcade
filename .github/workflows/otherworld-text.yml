name: Otherworld text review
on:
  pull_request:
    paths:
      - 'games/otherworld/**'
      - 'tests/otherworld-text-capture.cjs'
      - '.github/workflows/otherworld-text.yml'
permissions:
  contents: read
jobs:
  pictures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture branch and base layouts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/ow-base" "$BASE_SHA"
          node tests/otherworld-text-capture.cjs . "$RUNNER_TEMP/ow-pictures/after"
          node tests/otherworld-text-capture.cjs "$RUNNER_TEMP/ow-base" "$RUNNER_TEMP/ow-pictures/before"
      - uses: actions/upload-artifact@v4
        with:
          name: otherworld-text-before-after
          path: ${{ runner.temp }}/ow-pictures
