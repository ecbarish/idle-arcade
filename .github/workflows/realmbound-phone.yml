name: Realmbound phone review
on:
  pull_request:
    paths:
      - 'games/realmbound/**'
      - 'tests/realmbound-phone*'
      - '.github/workflows/realmbound-phone.yml'
permissions:
  contents: read
jobs:
  pictures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture branch and base layouts
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/rb-base" "$BASE_SHA"
          node tests/realmbound-phone-capture.cjs . "$RUNNER_TEMP/rb-pictures/after"
          node tests/realmbound-phone-capture.cjs "$RUNNER_TEMP/rb-base" "$RUNNER_TEMP/rb-pictures/before"
      - uses: actions/upload-artifact@v4
        with:
          name: realmbound-phone-before-after
          path: ${{ runner.temp }}/rb-pictures
