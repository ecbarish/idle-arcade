name: WD3 screen review
on:
  pull_request:
    paths: ['wildbond-godot/**', '.github/workflows/wd3-review.yml']
  workflow_dispatch:
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and a display
        run: |
          curl -sSLo godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          echo "GODOT=$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Import and render the actual screens
        run: |
          timeout 120 "$GODOT" --headless --path wildbond-godot --editor --import --quit
          timeout 120 xvfb-run -a "$GODOT" --path wildbond-godot --rendering-method gl_compatibility --script res://tests/battle_choices_screens.gd
      - uses: actions/upload-artifact@v4
        with:
          name: wd3-screens
          path: wildbond-godot/frames/wd3/*.png
