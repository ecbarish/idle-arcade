name: ac3 fix css
on:
  push:
    paths:
      - tools/ac3_fix_css.py
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: guest/briskets-crossing
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 tools/ac3_fix_css.py
      - name: commit the fixed stylesheet and remove this fixer
        run: |
          git config user.name abarish-dev
          git config user.email "319211409+abarish-dev@users.noreply.github.com"
          git add games/briskets-crossing/style.css
          git commit -m "AC3: restore the flex rule in the cabinet stylesheet"
          git push
          git rm tools/ac3_fix_css.py .github/workflows/ac3-fix-css.yml
          git commit -m "AC3: remove the one-shot stylesheet fixer"
          git push
