name: ac3 notes
on:
  push:
    paths:
      - tools/ac3_notes.py
permissions:
  contents: write
jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: guest/briskets-crossing
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 tools/ac3_notes.py
      - name: commit the notes and remove this helper
        run: |
          git config user.name abarish-dev
          git config user.email "319211409+abarish-dev@users.noreply.github.com"
          git add README.md START-HERE.md docs/COMMS.md docs/DEVELOPMENT-PATH.md
          git commit -m "AC3: project notes for Brisket's Crossing"
          git push
          git rm tools/ac3_notes.py .github/workflows/ac3-notes.yml
          git commit -m "AC3: remove the one-shot notes helper"
          git push
