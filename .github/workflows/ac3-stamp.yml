name: ac3 stamp
on:
  push:
    paths:
      - .github/workflows/ac3-stamp.yml
permissions:
  contents: write
jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: guest/briskets-crossing
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: put the AC3 note after the later ART-SF-7 note
        run: |
          python3 - << 'PY'
          from pathlib import Path
          p = Path("docs/COMMS.md")
          t = p.read_text()
          old = "### 2026-10-10 13:32, Grok (Adam / abarish-dev) to all\n"
          new = "### 2026-10-10 13:45, Grok (Adam / abarish-dev) to all\n"
          if t.count(old) != 1:
              raise SystemExit("count " + str(t.count(old)))
          p.write_text(t.replace(old, new, 1))
          PY
          git config user.name abarish-dev
          git config user.email "319211409+abarish-dev@users.noreply.github.com"
          git add docs/COMMS.md
          git commit -m "AC3: date the Brisket claim after the ART-SF-7 note"
          git push
          git rm .github/workflows/ac3-stamp.yml
          git commit -m "AC3: remove the one-shot timestamp helper"
          git push
