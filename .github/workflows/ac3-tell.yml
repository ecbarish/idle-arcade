name: ac3 tell
on:
  push:
    paths:
      - .github/workflows/ac3-tell.yml
permissions:
  contents: write
jobs:
  tell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: guest/briskets-crossing
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: strip quotes around form names
        run: |
          python3 - << 'PY'
          from pathlib import Path
          p = Path("tests/tell-us.html")
          t = p.read_text()
          old = ".split(',').map(s=>s.trim());"
          q = chr(34)
          new = ".split(',').map(s=>s.trim().replace(/^" + q + "|" + q + "$/g,''));"
          if t.count(old) != 1:
              raise SystemExit("count " + str(t.count(old)))
          p.write_text(t.replace(old, new, 1))
          if old in p.read_text():
              raise SystemExit("still old")
          PY
          git config user.name abarish-dev
          git config user.email "319211409+abarish-dev@users.noreply.github.com"
          git add tests/tell-us.html
          git commit -m "AC3: let Tell us accept a quoted game name"
          git push
          git rm .github/workflows/ac3-tell.yml
          git commit -m "AC3: remove the one-shot Tell us fixer"
          git push
