name: ac3 assemble
on:
  push:
    paths:
      - tools/ac3_assemble.py
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: guest/briskets-crossing
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 tools/ac3_assemble.py
      - name: commit the cabinet and remove this helper
        run: |
          git config user.name abarish-dev
          git config user.email "319211409+abarish-dev@users.noreply.github.com"
          git add games/briskets-crossing/game.js tests/briskets-crossing.html
          git commit -m "AC3: Brisket's Crossing cabinet and browser checks"
          git push
          git rm -r tools/ac3_parts
          git rm tools/ac3_assemble.py .github/workflows/ac3-assemble.yml
          git commit -m "AC3: remove the one-shot source assembler"
          git push
