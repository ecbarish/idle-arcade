name: ac3 merge main
on:
  push:
    paths:
      - .github/workflows/ac3-merge-main.yml
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: guest/briskets-crossing
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          cat tools/ac3_merge_a.py tools/ac3_merge_b.py > /tmp/ac3_merge_main.py
          python3 /tmp/ac3_merge_main.py
      - name: remove this helper
        run: |
          git config user.name abarish-dev
          git config user.email "319211409+abarish-dev@users.noreply.github.com"
          git rm tools/ac3_merge_a.py tools/ac3_merge_b.py .github/workflows/ac3-merge-main.yml
          git commit -m "AC3: remove the one-shot main merge helper"
          git push
