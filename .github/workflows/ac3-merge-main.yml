name: ac3 merge main
on:
  push:
    paths:
      - .github/workflows/ac3-merge-main.yml
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: guest/briskets-crossing
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: keep Brisket and the Lighthouse polish
        run: |
          python3 - << 'PY'
          import subprocess
          from pathlib import Path
          subprocess.check_call(["git", "config", "user.name", "abarish-dev"])
          subprocess.check_call(["git", "config", "user.email", "319211409+abarish-dev@users.noreply.github.com"])
          subprocess.check_call(["git", "fetch", "origin", "main"])
          merged = subprocess.run(["git", "merge", "origin/main", "--no-edit"])
          if merged.returncode != 0:
              unmerged = subprocess.check_output(["git", "diff", "--name-only", "--diff-filter=U"], text=True).split()
              if unmerged != ["docs/DEVELOPMENT-PATH.md"]:
                  raise SystemExit("unexpected " + " ".join(unmerged))
              lines = Path("docs/DEVELOPMENT-PATH.md").read_text().splitlines(keepends=True)
              out = []
              i = 0
              while i < len(lines):
                  if lines[i].startswith("<<<<<<<"):
                      i += 1
                      ours = []
                      while not lines[i].startswith("======="):
                          ours.append(lines[i]); i += 1
                      i += 1
                      theirs = []
                      while not lines[i].startswith(">>>>>>>"):
                          theirs.append(lines[i]); i += 1
                      i += 1
                      us, them = "".join(ours), "".join(theirs)
                      if "draft PR #160" in us and "AC2.1" in them:
                          out.extend([line for line in theirs if line.startswith("- [x] AC2.1")])
                          out.extend([line for line in ours if "draft PR #160" in line])
                      elif "**2026-10-10, AC3:**" in us and "(AC2.1)" in them:
                          out.extend(theirs)
                          out.append("\n")
                          out.extend(ours)
                      else:
                          raise SystemExit("unknown conflict")
                  else:
                      out.append(lines[i]); i += 1
              Path("docs/DEVELOPMENT-PATH.md").write_text("".join(out))
              subprocess.check_call(["git", "add", "docs/DEVELOPMENT-PATH.md"])
              still = subprocess.check_output(["git", "diff", "--name-only", "--diff-filter=U"], text=True).strip()
              if still:
                  raise SystemExit(still)
              subprocess.check_call(["git", "commit", "--no-edit"])
          text = Path("docs/DEVELOPMENT-PATH.md").read_text()
          if "<<<<<<<" in text or "- [x] AC2.1" not in text or "draft PR #160" not in text or "- [x] AC3" in text:
              raise SystemExit("path notes wrong")
          if text.find("(AC2.1)") > text.find("**2026-10-10, AC3:**"):
              raise SystemExit("lesson order")
          print("merge ok")
          PY
          git rm .github/workflows/ac3-merge-main.yml
          git commit -m "AC3: remove the one-shot main merge helper"
          git push
