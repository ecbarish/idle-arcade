name: ART-SF-6 doc note

on:
  push:
    branches:
      - guest/starfall-props
    paths:
      - .github/workflows/sf6-doc-note.yml
      - tools/art/_sf6_doc_note.py

permissions:
  contents: write

jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply project notes
        run: python3 tools/art/_sf6_doc_note.py
      - name: Commit notes and drop this helper
        run: |
          git config user.name "abarish-dev"
          git config user.email "319211409+abarish-dev@users.noreply.github.com"
          git add README.md START-HERE.md docs/COMMS.md docs/DEVELOPMENT-PATH.md
          git rm -f tools/art/_sf6_doc_note.py .github/workflows/sf6-doc-note.yml
          git status --short
          git commit -m "ART-SF-6: record the props claim in the project notes"
          git push origin HEAD:guest/starfall-props
