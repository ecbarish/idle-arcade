<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Starfall Guild</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: a handheld sim screen. Left = the dungeon window (live auto-battle); right = the guild menu in tabs. Chunky framed windows with blue title strips. */
:root{
  --bg:#d9e8c8; --bg-deep:#c6dbb0; --paper:#f8fbf1; --paper2:#eef4e2;
  --ink:#1d2433; --frame:#2b3550; --muted:#58677a; --line:#c9d5bb;
  --blue:#3a6fd8; --blue-d:#2a55b0; --gold:#f2a91a; --gold-d:#b87a06; --red:#e0483e; --green:#3fa66b; --violet:#8b5cf6;
  --f-pixel:'DotGothic16', 'MS Gothic', ui-monospace, monospace;
  --f-body:'M PLUS Rounded 1c', 'Segoe UI', system-ui, sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;
  background-image:linear-gradient(var(--bg-deep) 2px,transparent 2px),linear-gradient(90deg,var(--bg-deep) 2px,transparent 2px);background-size:32px 32px}
*{box-sizing:border-box}
[hidden]{display:none!important}
.home{display:inline-block;color:var(--blue-d);text-decoration:none;border:2px solid var(--blue-d);border-radius:999px;padding:4px 11px;font-size:13px;letter-spacing:0;text-transform:none;margin-right:6px;background:var(--paper)}
.home:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.px{font-family:var(--f-pixel);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.app{max-width:1260px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:14px}

/* windows */
.win{background:var(--paper);border:3px solid var(--frame);border-radius:8px;box-shadow:0 4px 0 var(--frame);overflow:hidden;min-width:0}
.win>.bar{background:var(--blue);color:#fff;font-family:var(--f-pixel);font-size:15px;padding:5px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:3px solid var(--frame)}
.win>.body{padding:12px 14px}

/* header */
.top{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(3,minmax(0,1fr));gap:12px}
.hcell{background:var(--paper);border:3px solid var(--frame);border-radius:8px;box-shadow:0 4px 0 var(--frame);padding:8px 12px;min-width:0}
.lbl{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.gname{font-family:var(--f-pixel);font-size:26px;line-height:1.1;color:var(--blue-d)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border:2px solid var(--frame);border-radius:999px;font-size:12px;font-weight:700;background:var(--paper2)}
.big{font-family:var(--f-pixel);font-size:28px;line-height:1.1;color:var(--gold-d)}
.mid{font-family:var(--f-pixel);font-size:24px;line-height:1.1}
.sm{font-size:12px;color:var(--muted)}

/* main grid */
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px;align-items:start}
.left{display:flex;flex-direction:column;gap:14px;min-width:0}
.right{min-width:0}
.stage{position:relative;aspect-ratio:16/10;max-width:100%;background:#2a2540}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;display:block}
.bstat{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-size:13px}
.hpbar{height:12px;border:2px solid var(--frame);border-radius:3px;background:#3b3552;overflow:hidden}
.hpbar i{display:block;height:100%;background:var(--red);transition:width .15s linear}
.hpbar.p i{background:var(--green)}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.status{font-size:13px;font-weight:700;margin-top:10px;min-height:1.4em}

.btn{border:2px solid var(--frame);border-radius:6px;background:var(--paper2);padding:6px 12px;font-weight:800;box-shadow:0 3px 0 var(--frame);transition:transform .05s}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--frame)}
.btn:disabled{opacity:.45;cursor:default}
.btn.gold{background:var(--gold);}
.btn.blue{background:var(--blue);color:#fff}
.btn.red{background:var(--paper2);color:var(--red);border-color:var(--red);box-shadow:0 3px 0 var(--red)}
.btn.red.armed{background:var(--red);color:#fff}
.btn.sm2{padding:3px 9px;font-size:12px}
.tgl{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13px;background:none;border:0;padding:0}
.tgl .sw{width:40px;height:22px;border:2px solid var(--frame);border-radius:999px;background:var(--line);position:relative}
.tgl .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--frame);transition:left .12s}
.tgl[aria-pressed="true"] .sw{background:var(--green)}
.tgl[aria-pressed="true"] .sw::after{left:20px;background:#fff}

/* tabs */
.tabs{display:flex;gap:4px;flex-wrap:wrap;padding:8px 8px 0;background:var(--paper2);border-bottom:3px solid var(--frame)}
.tabs button{border:2px solid var(--frame);border-bottom:0;border-radius:6px 6px 0 0;background:var(--paper);padding:6px 11px;font-weight:800;font-size:13px;display:flex;gap:5px;align-items:center;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--blue);color:#fff}
.badge{font-family:var(--f-pixel);font-size:11px;background:var(--red);color:#fff;border-radius:999px;padding:0 6px}
.tabbody{padding:14px}
.thead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.thead h2{font-family:var(--f-pixel);font-weight:400;font-size:22px;margin:0;line-height:1.1}
.sub{color:var(--muted);margin:3px 0 0;font-size:13px;max-width:62ch}
.seg{display:inline-flex;border:2px solid var(--frame);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--paper);padding:4px 10px;font-family:var(--f-pixel);font-size:13px}
.seg button.on{background:var(--frame);color:#fff}
h4{margin:16px 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800}

/* rows */
.row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-bottom:2px dashed var(--line)}
.row:last-child{border-bottom:0}
.portrait{width:48px;height:56px;image-rendering:pixelated;background:var(--paper2);border:2px solid var(--frame);border-radius:4px}
.nm{font-weight:800;font-size:15px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.stars{color:var(--gold-d);font-family:var(--f-pixel);letter-spacing:1px}
.cls{font-size:12px;font-weight:700;padding:0 6px;border-radius:4px;color:#fff}
.meta{font-size:12.5px;color:var(--muted)}
.acts{display:flex;flex-direction:column;gap:5px;align-items:stretch;min-width:118px}
.buy{border:2px solid var(--frame);border-radius:6px;background:var(--paper2);padding:4px 9px;text-align:right;box-shadow:0 3px 0 var(--frame);display:flex;flex-direction:column}
.buy .l{font-size:11px;font-weight:800;color:var(--muted)}
.buy .c{font-family:var(--f-pixel);font-size:14px}
.buy.can{background:var(--gold)}
.buy.can .l{color:var(--ink)}
.buy:disabled{opacity:.5;cursor:default}
.buy:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--frame)}
.icon{width:40px;height:40px;border:2px solid var(--frame);border-radius:6px;display:grid;place-items:center;font-family:var(--f-pixel);font-size:18px;color:#fff;justify-self:center}
.ms{display:flex;gap:8px;align-items:center;margin-top:4px;font-size:11px;color:var(--muted);font-family:var(--f-pixel)}
.msbar{flex:1;max-width:160px;height:6px;border:1px solid var(--frame);background:var(--paper2)}
.msbar i{display:block;height:100%;background:var(--blue)}
.locked{opacity:.55}
.empty{color:var(--muted);padding:10px 0}

.combos{display:flex;flex-wrap:wrap;gap:6px}
.combo{border:2px solid var(--frame);border-radius:6px;padding:4px 9px;font-size:12.5px;background:var(--paper2)}
.combo.on{background:#fff3cf;border-color:var(--gold-d)}
.combo b{font-family:var(--f-pixel);font-weight:400;font-size:14px}
.combo.unk{color:var(--muted);border-style:dashed}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.card{border:3px solid var(--frame);border-radius:8px;background:var(--paper);padding:10px;display:flex;flex-direction:column;gap:6px;text-align:left;box-shadow:0 3px 0 var(--frame);min-width:0}
button.card:hover{background:#fff7dd}
.card .t{font-weight:800;font-size:15px}
.card .d{font-size:12.5px;color:var(--muted)}
.card ul{margin:0;padding-left:16px;font-size:12.5px;color:var(--muted)}
.card canvas{align-self:center}
.r-common{--rc:#7b8a9c} .r-rare{--rc:var(--blue)} .r-epic{--rc:var(--violet)}
.rar{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--rc)}
.card.r-common,.card.r-rare,.card.r-epic{border-top:6px solid var(--rc)}
.state{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:1px 7px;border-radius:999px;border:2px solid currentColor}
.state.on{color:var(--green)} .state.off{color:var(--muted)}
.req{font-family:var(--f-pixel);font-size:12px;color:var(--muted)}
.inp{width:80px;padding:3px 6px;border:2px solid var(--frame);border-radius:4px;font-family:var(--f-pixel);background:#fff;color:var(--ink)}
.season{border:3px solid var(--frame);border-radius:8px;background:#fff3cf;padding:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.season .g{font-family:var(--f-pixel);font-size:22px;color:var(--violet)}
.road{display:flex;flex-direction:column}
.road div{padding:6px 0 6px 18px;position:relative;font-size:13px;color:var(--muted)}
.road div::before{content:"";position:absolute;left:2px;top:12px;width:8px;height:8px;border:2px solid var(--frame);background:var(--paper)}
.road div.here{color:var(--ink);font-weight:700}
.road div.here::before{background:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px 16px}
.stats .k{font-size:12px;color:var(--muted)} .stats .v{font-family:var(--f-pixel);font-size:17px}
.logl{list-style:none;margin:0;padding:0;font-size:13px;max-height:220px;overflow:auto}
.logl li{padding:4px 0;border-bottom:2px dashed var(--line)}
textarea{width:100%;min-height:64px;resize:vertical;border:2px solid var(--frame);border-radius:6px;padding:6px;font-family:var(--f-pixel);font-size:11px;background:#fff;color:var(--ink)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

/* modal + toasts */
.modal{position:fixed;inset:0;background:rgba(29,36,51,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.sheet{max-width:780px;width:100%;max-height:calc(100% - 32px);overflow:auto}
.sheet .body h2{font-family:var(--f-pixel);font-weight:400;font-size:24px;margin:0 0 4px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:30;max-width:min(340px,calc(100% - 32px));pointer-events:none}
.toast{background:var(--paper);border:3px solid var(--frame);border-left:10px solid var(--tc,var(--gold));border-radius:6px;padding:8px 11px;font-size:13px;font-weight:700;box-shadow:0 4px 0 var(--frame);animation:tin .2s steps(3)}
@keyframes tin{from{transform:translateY(10px);opacity:0}}

@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)} .top{grid-template-columns:repeat(2,minmax(0,1fr))} .top .gcell{grid-column:1/-1}}
@media (max-width:460px){.row{grid-template-columns:40px minmax(0,1fr)} .row .acts{grid-column:1/-1;flex-direction:row;min-width:0} .row .acts>*{flex:1} .portrait{width:40px;height:47px}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.hpbar i{transition:none}}
</style>

<div class="app">
  <header class="top">
    <div class="hcell gcell">
      <div class="lbl"><a class="home" href="../../index.html">← Arcade</a> · Season <span id="seasonNo" class="px">1</span> · <span id="regionName">Greenleaf Meadow</span></div>
      <div class="gname">Starfall Guild</div>
      <div class="sm" id="regionNote">No modifiers</div>
    </div>
    <div class="hcell"><div class="lbl">Gold</div><div class="big" id="gold">0</div><div class="sm px" id="gps">0/s</div></div>
    <div class="hcell"><div class="lbl">Dungeon</div><div class="mid px" id="floorTop">B1F</div><div class="sm px" id="bestTop">Best B1F</div></div>
    <div class="hcell"><div class="lbl">Renown</div><div class="mid px" style="color:var(--violet)" id="renTop">0</div><div class="sm px" id="renBonus">+0% gold, +0% attack</div></div>
  </header>

  <main class="grid">
    <section class="left">
      <div class="win">
        <div class="bar"><span id="stageTitle">B1F · Slime</span><span id="stageTag"></span></div>
        <div class="stage"><canvas id="stage" aria-label="Your party fighting in the dungeon"></canvas></div>
        <div class="body">
          <div class="bstat">
            <span class="lbl">Enemy</span><div class="hpbar"><i id="monHp" style="width:100%"></i></div><span class="px" id="monHpT">0</span>
            <span class="lbl">Party</span><div class="hpbar p"><i id="pHp" style="width:100%"></i></div><span class="px" id="pHpT">0</span>
          </div>
          <div class="status" id="status">Recruit adventurers at the Tavern.</div>
          <div class="ctrls">
            <button class="tgl" data-act="push" id="pushBtn" aria-pressed="true"><span class="sw"></span>Push deeper</button>
            <button class="btn sm2" data-act="back">Go up a floor</button>
            <button class="btn sm2 gold" data-act="relic" id="relicBtn" hidden>Choose a relic</button>
          </div>
        </div>
      </div>
      <div class="win">
        <div class="bar"><span>Party power</span><span class="px" id="powerT"></span></div>
        <div class="body"><div class="combos" id="activeCombos"></div></div>
      </div>
    </section>

    <section class="right">
      <div class="win">
        <nav class="tabs" role="tablist" aria-label="Guild menu">
          <button role="tab" data-act="tab" data-arg="party">Party</button>
          <button role="tab" data-act="tab" data-arg="tavern">Tavern <span class="badge" id="tavBadge" hidden>!</span></button>
          <button role="tab" data-act="tab" data-arg="town">Town</button>
          <button role="tab" data-act="tab" data-arg="staff">Staff <span class="badge" id="staffBadge" hidden>new</span></button>
          <button role="tab" data-act="tab" data-arg="guild">Guild</button>
          <button role="tab" data-act="tab" data-arg="ledger">Ledger</button>
        </nav>
        <div class="tabbody" id="tabbody"></div>
      </div>
    </section>
  </main>
</div>

<div class="modal" id="modal" hidden><div class="sheet win" role="dialog" aria-modal="true"><div class="bar" id="mbar">Notice</div><div class="body" id="sheet"></div></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="../../shared/engine.js"></script>
<script>
(function(){
'use strict';
const KEY='starfall-guild-save-v1';
const $=s=>document.querySelector(s);
const now=()=>Date.now();

/* ================= content ================= */
const CLASSES={
  swordsman:{name:'Swordsman',atk:10,hp:60,color:'#3a6fd8',note:'Steady all-rounder.'},

  monk:{name:'Monk',atk:11,hp:72,color:'#e07a2e',note:'Strong and sturdy.'},

const PREFIX=['','Elder ','Ancient ','Abyssal ','Celestial ','Void ','Mythic '];

const BIZ=[
  {name:'Potion Stall',ch:'P',col:'#3fa66b',base:15,inc:1,growth:1.07,floor:1},
  {name:'Bakery',ch:'B',col:'#e07a2e',base:220,inc:8,growth:1.08,floor:3},
  {name:'Armory',ch:'A',col:'#6b7a90',base:3500,inc:60,growth:1.09,floor:8},
  {name:'Alchemy Lab',ch:'L',col:'#8b5cf6',base:5e4,inc:450,growth:1.10,floor:15},
  {name:'Magic Emporium',ch:'M',col:'#3a6fd8',base:8e5,inc:3600,growth:1.11,floor:25},
  {name:'Airship Dock',ch:'D',col:'#2a9db0',base:1.4e7,inc:3e4,growth:1.12,floor:40},
  {name:'Dragon Bank',ch:'$',col:'#e0483e',base:3e8,inc:2.6e5,growth:1.13,floor:60},
];
const FAC=[
  {id:'smith',name:'Blacksmith',ch:'S',col:'#6b7a90',base:100,mult:2.3,max:Infinity,desc:l=>`Party attack ×1.15 per level. Now ×${fmt(1.15**l)}.`},
  {id:'chapel',name:'Chapel',ch:'C',col:'#d9a21b',base:100,mult:2.3,max:Infinity,desc:l=>`Party HP ×1.15 per level. Now ×${fmt(1.15**l)}.`},
  {id:'inn',name:'Inn',ch:'I',col:'#c2412f',base:150,mult:2.4,max:12,desc:l=>`Faster rest after a defeat, more healing between fights. Rest now ${restBase(l).toFixed(1)}s.`},
  {id:'tavern',name:'Tavern',ch:'T',col:'#e07a2e',base:300,mult:2.8,max:10,desc:l=>`Better recruits on the board. ★3 or better: ${Math.round(highOdds(l,S.crest.rep||0)*100)}%.`},

  {id:'counting',name:'Counting House',ch:'¥',col:'#3a6fd8',base:250,mult:2.3,max:Infinity,desc:l=>`Shop income ×1.2 per level. Now ×${fmt(1.2**l)}.`},
];

const RELICS={
  whet:{name:'Whetstone',r:'common',desc:'Attack ×1.3',atk:1.3},
  pouch:{name:'Leather Pouch',r:'common',desc:'Monster gold ×1.4',gold:1.4},
  band:{name:'Bandages',r:'common',desc:'Party HP ×1.4',hp:1.4},
  ledger:{name:'Merchant Ledger',r:'common',desc:'Shop income ×1.6',biz:1.6},
  coin:{name:'Lucky Coin',r:'common',desc:'Recruits cost 30% less',recruit:0.7},

function makeAdv(star,cls){S.nextId=(S.nextId||1)+1;return {id:S.nextId,name:pick(NAMES),cls:cls||pick(CLS_IDS),star,lvl:1,hair:pick(HAIR)};}

function merge(o){

  s.crest=Object.assign({},o.crest||{});s.fac=Object.assign({},o.fac||{});s.combosFound=Object.assign({},o.combosFound||{});

let S=fresh(),D=null;

/* ================= derived ================= */
function R(){return REGIONS[S.region]||REGIONS.meadow;}
function classCount(){const c={};for(const a of S.party)c[a.cls]=(c[a.cls]||0)+1;return c;}
function relicProd(k){let m=1;for(const id of S.relics){const v=RELICS[id][k];if(typeof v==='number')m*=v;}return m;}
function hasRelic(flag){return S.relics.some(id=>RELICS[id][flag]);}
function derive(){
  const r=R(),cr=id=>S.crest[id]||0,fc=id=>S.fac[id]||0,cc=classCount();
  const combos=COMBOS.filter(c=>c.test(cc));
  let cAtk=1,cHp=1,cGold=1;for(const c of combos){cAtk*=c.atk||1;cHp*=c.hp||1;cGold*=c.gold||1;}
  const renB=1+0.02*S.renown;
  const goldM=Math.pow(2,cr('banner'))*renB*relicProd('gold')*(r.gold||1)*cGold;
  const bizM=Math.pow(2,cr('banner'))*renB*Math.pow(1.2,fc('counting'))*relicProd('biz')*(r.biz||1);
  let atkM=Math.pow(1.15,fc('smith'))*Math.pow(1.5,cr('drills'))*renB*relicProd('atk')*(r.atk||1)*cAtk;
  const hpM=Math.pow(1.15,fc('chapel'))*Math.pow(1.5,cr('drills'))*relicProd('hp')*(r.hp||1)*cHp;
  if(hasRelic('saga')){let L=0;for(const a of S.party)L+=a.lvl;atkM*=1+0.01*L;}
  let patk=0,pmax=0,crit=0,heal=0,thief=0;const each=[];
  for(const a of S.party){const C=CLASSES[a.cls],g=STAR_MULT[a.star]*Math.pow(1.09,a.lvl-1);
    const at=C.atk*g*atkM,hp=C.hp*g*hpM;each.push({atk:at,hp});patk+=at;pmax+=hp;
    if(C.crit)crit+=C.crit*at;if(C.heal)heal+=C.heal;if(C.gold)thief+=C.gold;}
  const critShare=patk?crit/patk:0;
  let gps=0;const bizEach=BIZ.map((b,i)=>{const m=Math.pow(2,Math.floor(S.biz[i]/25));const v=b.inc*S.biz[i]*m*bizM;gps+=v;return {per:b.inc*m*bizM,total:v,mile:m};});
  return {combos,goldM,bizM,atkM,hpM,patk,pmax,critShare,heal,thief,each,gps,bizEach,
    rest:restBase(fc('inn'))*relicProd('rest')*(r.rest||1),regen:0.1+0.04*fc('inn')+S.relics.reduce((a,id)=>a+(RELICS[id].regen||0),0),
    speed:relicProd('speed'),lvlM:Math.pow(0.94,fc('training')),recruitM:relicProd('recruit')*(r.recruit||1),
    size:3+cr('hall'),boardN:3+(r.board||0)};
}

/* ================= economy ================= */
function gain(x){if(x>0)S.gold=Math.min(1e300,S.gold+x);}
function bizCostN(i,k){const b=BIZ[i],n=S.biz[i];return b.base*Math.pow(b.growth,n)*(Math.pow(b.growth,k)-1)/(b.growth-1);}
function bizMax(i){const b=BIZ[i],c0=b.base*Math.pow(b.growth,S.biz[i]);if(S.gold<c0)return 0;let k=Math.floor(Math.log(S.gold*(b.growth-1)/c0+1)/Math.log(b.growth));while(k>0&&bizCostN(i,k)>S.gold)k--;return k;}
function bizUnlocked(i){return S.best>=BIZ[i].floor;}
function buyBiz(i,mode){if(!bizUnlocked(i))return false;const k=mode==='max'?bizMax(i):Number(mode);if(k<=0)return false;const c=bizCostN(i,k);if(c>S.gold)return false;
  const before=Math.floor(S.biz[i]/25);S.gold-=c;S.biz[i]+=k;if(Math.floor(S.biz[i]/25)>before)toast(`${BIZ[i].name} income doubled!`,'var(--blue)');
  const tot=S.biz.reduce((a,b)=>a+b,0);if(tot>S.stats.bizMax)S.stats.bizMax=tot;D=derive();return true;}
function facCost(f){const l=S.fac[f.id]||0;return Math.ceil(f.base*Math.pow(f.mult,l));}
function buyFac(id){const f=FAC.find(x=>x.id===id),l=S.fac[id]||0;if(l>=f.max)return false;const c=facCost(f);if(S.gold<c)return false;
  S.gold-=c;S.fac[id]=l+1;const tot=Object.values(S.fac).reduce((a,b)=>a+b,0);if(tot>S.stats.facMax)S.stats.facMax=tot;D=derive();return true;}
function lvlCostN(a,k){const base=5*(1+0.5*a.star)*D.lvlM,r=1.16;return base*Math.pow(r,a.lvl-1)*(Math.pow(r,k)-1)/(r-1);}
function lvlMax(a){const base=5*(1+0.5*a.star)*D.lvlM,r=1.16,c0=base*Math.pow(r,a.lvl-1);if(S.gold<c0)return 0;let k=Math.floor(Math.log(S.gold*(r-1)/c0+1)/Math.log(r));while(k>0&&lvlCostN(a,k)>S.gold)k--;return k;}
function levelUp(id,mode){const a=S.party.find(x=>x.id===id);if(!a)return false;const k=mode==='max'?lvlMax(a):Number(mode);if(k<=0)return false;const c=lvlCostN(a,k);if(c>S.gold)return false;
  S.gold-=c;const oldMax=D.pmax;a.lvl+=k;if(a.lvl>S.stats.maxLvl)S.stats.maxLvl=a.lvl;D=derive();if(!S.resting)S.php+=Math.max(0,D.pmax-oldMax);return true;}

/* ================= tavern ================= */
function rollStar(){const w=starWeights(S.fac.tavern||0,S.crest.rep||0);let t=w.reduce((a,b)=>a+b,0),r=Math.random()*t;for(let i=0;i<5;i++){r-=w[i];if(r<=0)return i+1;}return 1;}
function recruitCost(a){return Math.ceil(30*Math.pow(3.2,a.star-1)*D.recruitM);}
function refreshBoard(){S.board=Array.from({length:D.boardN},()=>{S.nextId++;return {id:S.nextId,name:pick(NAMES),cls:pick(CLS_IDS),star:rollStar(),lvl:1,hair:pick(HAIR)};});S.boardT=90;}
function rerollCost(){return Math.ceil((20+S.best*6)*Math.pow(1.5,S.rerolls));}
function recruit(id){const a=S.board.find(x=>x.id===id);if(!a||S.party.length>=D.size)return false;const c=recruitCost(a);if(S.gold<c)return false;
  S.gold-=c;S.board=S.board.filter(x=>x.id!==id);S.party.push(a);S.stats.recruits++;const oldMax=D.pmax;D=derive();if(!S.resting)S.php+=D.pmax-oldMax;
  log(`<b>${a.name}</b> the ${stars(a.star).replace(/☆/g,'')} ${CLASSES[a.cls].name} joined the guild.`);checkCombos();return true;}
function dismiss(id){const a=S.party.find(x=>x.id===id);if(!a)return;S.party=S.party.filter(x=>x.id!==id);D=derive();S.php=Math.min(S.php,D.pmax);log(`${a.name} left the guild.`);}
function checkCombos(){for(const c of D.combos){if(!S.combosFound[c.id]){S.combosFound[c.id]=true;toast(`Combo found: ${c.name}! ${c.desc}`,'var(--gold)');log(`Combo discovered: <b>${c.name}</b>.`);}}}
function power(a,i){const e=D.each[i];return e?e.atk+e.hp/5:0;}

/* ================= dungeon ================= */
function isBoss(f){return f%(R().boss5?5:10)===0;}
function monFor(f){
  const idx=Math.floor((f-1)/10),M=MONSTERS[idx%MONSTERS.length],pre=PREFIX[Math.min(PREFIX.length-1,Math.floor(idx/MONSTERS.length))],boss=isBoss(f),r=R();
  const hp=40*Math.pow(1.19,f-1)*(boss?5:1)*(r.mhp||1),atk=6*Math.pow(1.17,f-1)*(boss?2.5:1)*(r.matk||1);
  return {f,boss,name:pre+M.n+(boss?' Lord':''),k:M.k,c:M.c,hp,max:hp,atk,gold:5*Math.pow(1.17,f-1)*(boss?10:1)};
}
function spawn(){S.mon=monFor(S.floor);}
const fx={hits:[],monHit:0,partyHit:0,swing:0};
function battleTick(h){
  if(!S.party.length){return;}
  if(!S.mon||S.mon.f!==S.floor)spawn();
  if(S.pushWait>0)S.pushWait=Math.max(0,S.pushWait-h);
  if(S.resting>0){S.resting-=h;if(S.resting<=0){S.resting=0;S.php=D.pmax;}return;}
  if(S.php>D.pmax)S.php=D.pmax;
  S.acc+=h*D.speed;
  let guard=0;
  while(S.acc>=0.5&&guard++<400){
    S.acc-=0.5;const m=S.mon;
    let dmg=D.patk*(0.85+Math.random()*0.3);const crit=Math.random()<0.25*D.critShare;
    if(crit)dmg*=2;m.hp-=dmg;fxHit('m',dmg,crit);
    if(m.hp<=0){
      const g=m.gold*D.goldM*(1+D.thief);gain(g);S.stats.kills++;fxHit('g',g);
      if(m.boss){S.stats.bosses++;S.relicPending++;log(`Defeated <b>${m.name}</b> on ${floorName(m.f)}. A relic dropped!`);toast(`Boss down: ${m.name}. Choose a relic!`,'var(--violet)');}
      S.php=Math.min(D.pmax,S.php+D.pmax*D.regen);
      if(S.push&&S.pushWait<=0){S.floor++;if(S.floor>S.best){S.best=S.floor;if(S.best>S.stats.bestEver)S.stats.bestEver=S.best;
        BIZ.forEach((b,i)=>{if(b.floor===S.best)toast(`${b.name} can now open in town.`,'var(--green)');});}}
      spawn();continue;
    }
    const hit=m.atk*(0.85+Math.random()*0.3);S.php-=hit;S.php=Math.min(D.pmax,S.php+D.pmax*D.heal);fxHit('p',hit);
    if(S.php<=0){
      S.php=0;const ph=hasRelic('phoenix');S.resting=ph?0.01:D.rest;
      if(!ph&&S.floor>1)S.floor--;S.pushWait=30;spawn();
      fx.lastDefeat=performance.now();break;
    }
  }
}
function fxHit(t,v,crit){if(fx.hits.length>30)fx.hits.shift();fx.hits.push({t,v,crit,age:0,x:Math.random()});if(t==='m')fx.monHit=0.15;if(t==='p')fx.partyHit=0.15;fx.swing=0.2;}

/* ================= relics ================= */
function ensureRelicOffer(){if(S.relicOffer||S.relicPending<=0)return;const pool=Object.keys(RELICS).filter(id=>!(RELICS[id].unique&&S.relics.includes(id)));
  const wt={common:65,rare:28,epic:7},out=[];
  while(out.length<3&&out.length<pool.length){const cand=pool.filter(id=>!out.includes(id));let t=0;for(const id of cand)t+=wt[RELICS[id].r];let r=Math.random()*t;
    for(const id of cand){r-=wt[RELICS[id].r];if(r<=0){out.push(id);break;}}if(r>0)out.push(cand[cand.length-1]);}
  S.relicOffer=out;}
function takeRelic(id,auto){if(!S.relicOffer||!S.relicOffer.includes(id))return;S.relics.push(id);S.relicPending--;S.relicOffer=null;D=derive();
  log(`${auto?'Nyx picked':'Took'} the <b>${RELICS[id].name}</b>.`);if(!auto)toast(`${RELICS[id].name}: ${RELICS[id].desc}`,'var(--violet)');}

/* ================= seasons ================= */
const SEASON_MIN=20;
function renownFor(best){return best<SEASON_MIN?0:Math.floor(Math.pow(best/SEASON_MIN,3)*R().ren);}
function renownGain(){return renownFor(S.best);}
function nextRenownFloor(){const g=renownGain();for(let f=Math.max(S.best+1,SEASON_MIN);f<S.best+500;f++)if(renownFor(f)>g)return f;return null;}
function newSeason(auto){
  const g=renownGain();if(g<=0||S.regionOffer)return;
  const keepN=S.crest.legends||0;const ranked=S.party.map((a,i)=>({a,p:power(a,i)})).sort((x,y)=>y.p-x.p).slice(0,keepN).map(o=>Object.assign({},o.a,{lvl:1}));
  S.renown+=g;S.renownLife+=g;S.stats.seasons++;
  log(`Season ${S.stats.seasons} ended at ${floorName(S.best)}. +${fmt(g)} Renown.`);
  const prev=S.region;
  Object.assign(S,{gold:startGold(S.crest.funds||0),floor:1,best:1,push:true,pushWait:0,party:ranked,board:[],boardT:0,rerolls:0,biz:BIZ.map(()=>0),fac:{},
    relics:[],relicPending:0,relicOffer:null,mon:null,php:0,resting:0,acc:0});
  S.stats.run=0;S.stats.bizMax=0;S.stats.facMax=0;
  const ids=Object.keys(REGIONS).filter(k=>k!=='meadow'&&k!==prev),offer=[];
  while(offer.length<3&&ids.length)offer.push(ids.splice(Math.floor(Math.random()*ids.length),1)[0]);
  S.regionOffer=offer;D=derive();
  if(auto)chooseRegion(offer[0],true);
}
function chooseRegion(id,auto){if(!S.regionOffer||!S.regionOffer.includes(id))return;S.region=id;S.regionOffer=null;D=derive();refreshBoard();
  if(!S.party.length){const a=makeAdv(1,'swordsman');S.party.push(a);}
  D=derive();S.php=D.pmax;spawn();
  log(`Season ${S.stats.seasons+1} begins in ${REGIONS[id].name}.`);toast(`${auto?'Aldric: ':''}New season in ${REGIONS[id].name}!`,'var(--violet)');closeModal();}

/* ================= staff ================= */
function staffOn(id){return S.staff.unl[id]&&S.staff.on[id];}
function checkStaff(){for(const s of STAFF){if(S.staff.unl[s.id])continue;const [a,b]=s.prog();if(a>=b){S.staff.unl[s.id]=true;S.staff.on[s.id]=s.id!=='aldric';S.seenStaff=false;
  log(`<b>${s.who}</b> the ${s.role} joined your staff.`);toast(`${s.who} the ${s.role} wants to work for you!`,'var(--green)');}}}
function runStaff(h){
  const iv=staffIv(S.crest.staffx||0);
  const due=id=>{S.staff.t[id]=(S.staff.t[id]||0)+h;if(S.staff.t[id]>=iv){S.staff.t[id]=0;return true;}return false;};
  if(staffOn('mina')&&due('mina')){
    const aff=S.board.filter(a=>recruitCost(a)<=S.gold).sort((x,y)=>y.star-x.star);
    if(aff.length){if(S.party.length<D.size)recruit(aff[0].id);
      else{let wi=-1,wp=Infinity;S.party.forEach((a,i)=>{const p=a.star*1e6+a.lvl;if(p<wp){wp=p;wi=i;}});const weak=S.party[wi];
        if(weak&&aff[0].star>weak.star){dismiss(weak.id);recruit(aff[0].id);}}}}
  if(staffOn('kuro')&&due('kuro')){for(let n=0;n<5;n++){let best=null,bc=Infinity;for(const a of S.party){const c=lvlCostN(a,1);if(c<bc){bc=c;best=a;}}if(!best||!levelUp(best.id,1))break;}}
  if(staffOn('gruff')&&due('gruff')){for(let n=0;n<5;n++){let bi=-1,bc=Infinity;BIZ.forEach((b,i)=>{if(!bizUnlocked(i))return;const c=bizCostN(i,1);if(c<bc){bc=c;bi=i;}});if(bi<0||!buyBiz(bi,1))break;}}
  if(staffOn('brann')&&due('brann')){let bf=null,bc=Infinity;for(const f of FAC){if((S.fac[f.id]||0)>=f.max)continue;const c=facCost(f);if(c<bc){bc=c;bf=f;}}if(bf)buyFac(bf.id);}
  if(staffOn('nyx')){if(S.relicPending>0){ensureRelicOffer();const b=S.relicOffer.slice().sort((x,y)=>RAR_ORDER[RELICS[y].r]-RAR_ORDER[RELICS[x].r]);takeRelic(b[0],true);}
    S.staff.t.nyxB=(S.staff.t.nyxB||0)+h;if(S.staff.t.nyxB>=30){S.staff.t.nyxB=0;refreshBoard();}}
  if(staffOn('aldric')&&S.autoAt>0&&renownGain()>=S.autoAt)newSeason(true);
}

/* ================= loop ================= */
function advance(dt){
  if(S.regionOffer||!(dt>0))return;
  const steps=Math.min(400,Math.max(1,Math.ceil(dt/0.25))),h=dt/steps;
  for(let k=0;k<steps;k++){
    D=derive();gain(D.gps*h);S.stats.play+=h;S.stats.run+=h;
    S.boardT-=h;if(S.boardT<=0)refreshBoard();
    battleTick(h);runStaff(h);if(S.regionOffer)break;
  }
  D=derive();checkStaff();
}
function farmRate(){
  if(!S.party.length||!S.mon)return 0;const m=monFor(S.floor);const ticks=Math.ceil(m.max/Math.max(1e-9,D.patk));
  const taken=Math.max(0,m.atk*ticks-D.pmax*D.heal*ticks);if(taken>D.pmax)return 0;
  return m.gold*D.goldM*(1+D.thief)/(ticks*0.5/D.speed);
}
function offline(sec){
  if(S.regionOffer||sec<30)return null;sec=Math.min(sec,86400);D=derive();
  const eff=0.5+0.1*(S.crest.night||0),rate=D.gps+farmRate(),g=rate*sec*eff;gain(g);
  S.stats.play+=sec;S.stats.run+=sec;S.boardT=Math.min(S.boardT,0);if(S.resting){S.resting=0;S.php=D.pmax;}
  return {sec,eff,gain:g,farm:farmRate()>0};
}

function importSave(t){const o=Arcade.decode(t);if(!o||!o.stats)throw new Error('bad');S=merge(o);S.last=now();D=derive();save();}

/* ================= pixel art ================= */
function hero(ctx,x,y,p,a,f){
  const C=CLASSES[a.cls],skin='#f6d3b0',dk='#2b2b3a';const r=(gx,gy,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x+gx*p),Math.round(y+gy*p),Math.ceil(w*p),Math.ceil(h*p));};
  const step=f?1:0;
  // weapon behind/side
  if(a.cls==='mage'){r(8,-1,1,12,'#8a5a2b');r(7,-2,3,2,'#c4a7ff');}
  if(a.cls==='cleric'){r(8,0,1,11,'#e6c35a');r(7,1,3,1,'#e6c35a');}
  if(a.cls==='archer'){r(8,2,1,1,'#8a5a2b');r(9,3,1,5,'#8a5a2b');r(8,8,1,1,'#8a5a2b');r(8,3,1,5,'#e8e4d4');}
  // legs
  r(2,10,1,2+step,dk);r(5,10,1,3-step,dk);
  // body
  r(1,6,6,4,C.color);r(0,6,1,3,C.color);r(7,6,1,3,C.color);r(1,9,6,1,dk);
  if(a.cls==='thief')r(1,6,6,1,'#e0483e');
  if(a.cls==='cleric')r(3,6,2,4,'#fff');
  // head
  r(1,2,6,4,skin);
  r(2,4,1,2,dk);r(5,4,1,2,dk);r(2,4,1,1,'#fff');r(5,4,1,1,'#fff');
  r(1,5,1,1,'#f4a0a0');r(6,5,1,1,'#f4a0a0');
  // hair / headgear
  if(a.cls==='knight'){r(0,0,8,3,'#9aa5b5');r(0,3,1,2,'#9aa5b5');r(7,3,1,2,'#9aa5b5');r(3,-1,2,1,'#e0483e');}
  else{r(1,0,6,2,a.hair);r(0,1,1,4,a.hair);r(7,1,1,3,a.hair);r(1,2,2,1,a.hair);r(5,2,2,1,a.hair);r(3,2,1,1,a.hair);}
  if(a.cls==='mage'){r(-1,0,10,1,'#6d3fd0');r(1,-1,6,1,'#6d3fd0');r(2,-2,4,1,'#6d3fd0');r(3,-3,3,1,'#6d3fd0');r(5,-4,2,1,'#6d3fd0');}
  if(a.cls==='monk')r(1,1,6,1,'#e0483e');
  // front weapon
  if(a.cls==='swordsman'){r(8,1,1,7,'#dfe6ee');r(7,7,3,1,'#8a5a2b');r(8,8,1,1,'#8a5a2b');}
  if(a.cls==='knight'){r(-1,5,3,5,'#c9d2dc');r(-1,6,3,1,'#f2a91a');}
  if(a.cls==='thief'){r(8,7,2,1,'#dfe6ee');r(7,7,1,1,'#8a5a2b');}
  if(a.cls==='monk'){r(-1,7,1,1,skin);r(8,7,1,1,skin);}
}
function staffSprite(ctx,x,y,p,s){hero(ctx,x,y,p,{cls:'swordsman',hair:s.hair},0);ctx.fillStyle=s.col;ctx.fillRect(x+1*p,y+6*p,6*p,4*p);ctx.fillStyle='#fff';ctx.fillRect(x+3*p,y+6*p,2*p,1*p);}
function monsterArt(ctx,cx,by,p,m,t){
  const r=(gx,gy,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(cx+gx*p),Math.round(by+gy*p),Math.ceil(w*p),Math.ceil(h*p));};
  const c=m.c,dk='#1d2433',eye='#fff';const b=Math.sin(t*4)>0?1:0;
  if(m.k==='slime'){const w=[4,8,10,12,12,12];w.forEach((ww,i)=>r(-ww/2,-6+i+b*0.5,ww,1,c));r(-6,-1,12,1,'#3a9b49');r(-3,-4,2,2,eye);r(1,-4,2,2,eye);r(-2,-3,1,1,dk);r(2,-3,1,1,dk);r(-4,-5,2,1,'#b6f0bd');}
  else if(m.k==='bat'){const fl=b?-2:0;r(-2,-7,4,4,c);r(-6,-7+fl,4,2,c);r(2,-7+fl,4,2,c);r(-8,-6+fl,2,2,c);r(6,-6+fl,2,2,c);r(-1,-6,1,1,'#ff5a5a');r(1,-6,1,1,'#ff5a5a');r(-1,-3,1,2,c);r(1,-3,1,2,c);}
  else if(m.k==='hum'){r(-2,-14,4,4,c);r(-1,-12,1,1,'#ff5a5a');r(1,-12,1,1,'#ff5a5a');r(-3,-10,6,5,c);r(-4,-10,1,4,c);r(3,-10,1,4,c);r(-3,-5,2,5-b,c);r(1,-5,2,4+b,c);r(4,-12,1,7,'#8a5a2b');}
  else if(m.k==='ghost'){r(-4,-14,8,8,c);r(-5,-12,10,6,c);for(let i=-5;i<5;i+=2)r(i,-6,1,2+((i+Math.floor(t*4))&1),c);r(-2,-11,2,2,dk);r(1,-11,2,2,dk);}
  else{r(-8,-9,12,6,c);r(3,-13,5,5,c);r(7,-11,2,2,c);r(5,-12,1,1,'#ffd34a');r(-12,-7,4,2,c);r(-14,-6,2,1,c);r(-6,-3,2,3,c);r(0,-3,2,3,c);r(-6,-14+b,6,4,'#a33a30');r(-4,-16+b,3,2,'#a33a30');}
}

    CREST.forEach(c=>{const l=S.crest[c.id]||0;$('#cl-'+c.id).textContent=l?`Lv ${l}`:'';$('#cd-'+c.id).textContent=c.desc(l);const b=$('#cb-'+c.id);
      if(l>=c.max){$('#cc-'+c.id).textContent='Max';b.disabled=true;b.classList.remove('can');return;}const cost=c.cost(l);$('#cc-'+c.id).textContent=fmt(cost);b.disabled=S.renown<cost;b.classList.toggle('can',S.renown>=cost);});}
},
ledger:{
  key(){return 'l';},
  build(){return `<div class="thead"><div><h2>Ledger</h2><p class="sub">The game saves in this browser every 10 seconds. Export a backup now and then: clearing site data erases it.</p></div></div>
    <div class="stats">${[['Time played','l1'],['This season','l2'],['Seasons','l3'],['Deepest floor ever','l4'],['Monsters defeated','l5'],['Bosses defeated','l6'],['Adventurers hired','l7'],['Renown earned','l8']].map(([k,id])=>`<div><div class="k">${k}</div><div class="v" id="${id}"></div></div>`).join('')}</div>
    <h4>Guild diary</h4><ul class="logl" id="logl"></ul>
    <h4>Save</h4><textarea id="saveTxt" placeholder="Export puts your save here. Paste a save here to import it." aria-label="Save data"></textarea>
    <div class="btnrow"><button class="btn" data-act="save">Save now</button><button class="btn" data-act="export">Export</button><button class="btn" data-act="copy">Copy</button><button class="btn" data-act="import">Import pasted save</button><button class="btn red" data-act="reset">Erase everything</button></div>
    <p class="sub" id="saveMsg"></p>`;},
  update(){const s=S.stats,set=(id,v)=>{const e=$('#'+id);if(e)e.textContent=v;};set('l1',fmtTime(s.play));set('l2',fmtTime(s.run));set('l3',s.seasons);set('l4',floorName(s.bestEver));set('l5',fmtI(s.kills));set('l6',s.bosses);set('l7',s.recruits);set('l8',fmt(S.renownLife));
    const L=$('#logl'),html=S.log.slice(0,25).map(m=>`<li>${m}</li>`).join('');if(L.dataset.h!==html){L.innerHTML=html;L.dataset.h=html;}}
}};
let curKey=null;
function renderTab(force){const t=TABS[S.tab]||TABS.party;const k=S.tab+':'+t.key();
  if(force||k!==curKey){curKey=k;$('#tabbody').innerHTML=t.build();portraitsAfterBuild();}
  MODES.forEach(m=>{const b=$('#mode-'+m);if(b)b.classList.toggle('on',String(S.buy)===String(m));});t.update();
  document.querySelectorAll('.tabs [role=tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.arg===S.tab?'true':'false'));}

/* ================= HUD ================= */
function updateUI(){
  const r=R(),m=S.mon;
  $('#seasonNo').textContent=S.stats.seasons+1;$('#regionName').textContent=r.name;$('#regionNote').textContent=r.mods.join(' · ');
  $('#gold').textContent=fmt(S.gold);$('#gps').textContent=`${fmt(D.gps)}/s from shops`;
  $('#floorTop').textContent=floorName(S.floor);$('#bestTop').textContent=`Best ${floorName(S.best)}`;
  $('#renTop').textContent=fmt(S.renown);$('#renBonus').textContent=`+${fmt(S.renown*2)}% gold, +${fmt(S.renown*2)}% attack`;
  $('#stageTitle').textContent=m?`${floorName(m.f)} · ${m.name}`:floorName(S.floor);$('#stageTag').textContent=m&&m.boss?'BOSS':'';
  $('#monHp').style.width=(m?Math.max(0,m.hp/m.max*100):0)+'%';$('#monHpT').textContent=m?fmt(Math.max(0,m.hp)):'-';
  $('#pHp').style.width=(D.pmax?Math.max(0,S.php/D.pmax*100):0)+'%';$('#pHpT').textContent=fmt(Math.max(0,S.php));
  let st;if(!S.party.length)st='No adventurers. Hire someone at the Tavern.';else if(S.resting>0)st=`Party wiped out. Resting at the inn: ${S.resting.toFixed(1)}s.`;
  else if(S.push&&S.pushWait>0)st=`Regrouping before the next push: ${Math.ceil(S.pushWait)}s. Farming ${floorName(S.floor)}.`;else if(S.push)st='Fighting and pushing deeper.';else st=`Farming ${floorName(S.floor)}.`;
  $('#status').textContent=st;$('#pushBtn').setAttribute('aria-pressed',S.push?'true':'false');
  const rb=$('#relicBtn');rb.hidden=S.relicPending<=0;rb.textContent=`Choose a relic (${S.relicPending})`;
  $('#powerT').textContent=`ATK ${fmt(D.patk)} · HP ${fmt(D.pmax)}`;
  const ac=$('#activeCombos'),html=D.combos.length?D.combos.map(c=>`<span class="combo on"><b>${c.name}</b> · ${c.desc}</span>`).join(''):`<span class="sm">No combos active. Mix classes to find them: ${Object.keys(S.combosFound).length}/${COMBOS.length} found.</span>`;
  if(ac.dataset.h!==html){ac.innerHTML=html;ac.dataset.h=html;}
  $('#tavBadge').hidden=!(S.party.length<D.size&&S.board.some(a=>recruitCost(a)<=S.gold));$('#staffBadge').hidden=S.seenStaff!==false;
  if(S.regionOffer&&modalKind!=='region')openModal('region','New season',regionHTML());
  if(modalKind==='relic'&&S.relicPending<=0)closeModal();
  renderTab(false);
}

/* ================= events ================= */
function arm(el,label,armedLabel){if(el.classList.contains('armed')){el.classList.remove('armed');el.textContent=label;return true;}
  el.classList.add('armed');el.textContent=armedLabel;setTimeout(()=>{if(el.isConnected){el.classList.remove('armed');el.textContent=label;}},4000);return false;}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,arg=el.dataset.arg;
  switch(a){
    case 'tab':S.tab=arg;renderTab(true);break;
    case 'mode':S.buy=arg==='max'?'max':Number(arg);break;
    case 'lvl':levelUp(Number(arg),S.buy);break;
    case 'dismiss':if(arm(el,'Dismiss','Sure?'))dismiss(Number(arg));break;
    case 'recruit':recruit(Number(arg));break;
    case 'reroll':{const c=rerollCost();if(S.gold>=c){S.gold-=c;S.rerolls++;refreshBoard();}break;}
    case 'biz':buyBiz(Number(arg),S.buy);break;
    case 'fac':buyFac(arg);break;
    case 'push':S.push=!S.push;if(S.push)S.pushWait=0;break;
    case 'back':if(S.floor>1){S.floor--;S.push=false;spawn();}break;
    case 'relic':if(S.relicPending>0)openModal('relic','Relic',relicHTML());break;
    case 'takerelic':takeRelic(arg,false);if(S.relicPending>0)openModal('relic','Relic',relicHTML());else closeModal();break;
    case 'region':chooseRegion(arg,false);break;
    case 'close':if(modalKind!=='region')closeModal();break;
    case 'staff':S.staff.on[arg]=!S.staff.on[arg];break;
    case 'season':if(arm(el,'End the season','Click again to end it'))newSeason(false);break;
    case 'crest':{const c=CREST.find(x=>x.id===arg),l=S.crest[arg]||0;if(l>=c.max)break;const cost=c.cost(l);if(S.renown<cost)break;S.renown-=cost;S.crest[arg]=l+1;D=derive();log(`Crest: <b>${c.name}</b> level ${l+1}.`);if(arg==='hall')curKey=null;break;}
    case 'save':save();$('#saveMsg').textContent='Saved.';break;
    case 'export':$('#saveTxt').value=exportSave();$('#saveMsg').textContent='Save exported above. Keep a copy somewhere safe.';break;
    case 'copy':{const t=$('#saveTxt');if(!t.value)t.value=exportSave();const fb=()=>{t.select();$('#saveMsg').textContent='Selected. Press Ctrl+C to copy.';};
      try{navigator.clipboard.writeText(t.value).then(()=>$('#saveMsg').textContent='Copied.',fb);}catch(err){fb();}break;}
    case 'import':try{importSave($('#saveTxt').value);closeModal();curKey=null;$('#saveMsg').textContent='Save imported.';}catch(err){$('#saveMsg').textContent="That text isn't a Starfall Guild save. Paste the whole exported block.";}break;
    case 'reset':if(arm(el,'Erase everything','Click again to erase')){S=fresh();boot0();save();closeModal();curKey=null;toast('Everything erased. A new guild opens its doors.');}break;
  }
  updateUI();
});
document.addEventListener('change',e=>{if(e.target.id==='autoAt'){S.autoAt=Math.max(1,Math.floor(Number(e.target.value)||1));e.target.value=S.autoAt;}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalKind&&modalKind!=='region')closeModal();});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&modalKind!=='region')closeModal();});

/* ================= stage canvas ================= */
const cv=$('#stage'),cx=cv.getContext('2d');let PW=0,PH=0;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){const r=cv.getBoundingClientRect();const dpr=Math.min(2,window.devicePixelRatio||1);PW=r.width;PH=r.height;cv.width=Math.round(PW*dpr);cv.height=Math.round(PH*dpr);cx.setTransform(dpr,0,0,dpr,0,0);cx.imageSmoothingEnabled=false;}
if(window.ResizeObserver)new ResizeObserver(resize).observe(cv);else addEventListener('resize',resize);
let lastF=performance.now();
function frame(t){
  requestAnimationFrame(frame);if(!PW||document.hidden)return;
  const dt=Math.min(0.05,(t-lastF)/1000);lastF=t;const ts=t/1000;
  const p=Math.max(2,Math.floor(PH/64)),floorY=Math.floor(PH*0.78);
  // wall
  cx.fillStyle='#3b3552';cx.fillRect(0,0,PW,floorY);
  cx.fillStyle='#463f63';const bw=p*12,bh=p*6;
  for(let y=0,row=0;y<floorY;y+=bh,row++)for(let x=(row%2)*bw/2-bw;x<PW;x+=bw)cx.fillRect(Math.round(x)+p/2,y+p/2,bw-p,bh-p);
  // torches
  [0.2,0.8].forEach((fxp,i)=>{const tx=Math.round(PW*fxp),ty=Math.round(floorY*0.35);cx.fillStyle='#8a5a2b';cx.fillRect(tx-p,ty,p*2,p*6);
    const fl=reduce?0:Math.sin(ts*12+i*3)*p;cx.fillStyle='#f2a91a';cx.fillRect(tx-p*2,ty-p*4+fl,p*4,p*4);cx.fillStyle='#ffe28a';cx.fillRect(tx-p,ty-p*3+fl,p*2,p*2);
    const g=cx.createRadialGradient(tx,ty,2,tx,ty,PW*0.18);g.addColorStop(0,'rgba(242,169,26,.18)');g.addColorStop(1,'rgba(242,169,26,0)');cx.fillStyle=g;cx.fillRect(tx-PW*.2,ty-PW*.2,PW*.4,PW*.4);});
  // floor
  cx.fillStyle='#5a4a3a';cx.fillRect(0,floorY,PW,PH-floorY);cx.fillStyle='#6b5946';for(let x=0;x<PW;x+=p*10)cx.fillRect(x,floorY,p*9,p);
  cx.fillStyle='#4a3c2f';for(let x=p*5;x<PW;x+=p*10)cx.fillRect(x,floorY+p*4,p*8,p);
  // floor label
  cx.fillStyle='rgba(29,36,51,.7)';cx.fillRect(p*2,p*2,p*22,p*9);cx.fillStyle='#ffe28a';cx.font=`${p*6}px DotGothic16, monospace`;cx.textBaseline='top';cx.fillText(floorName(S.floor),p*4,p*3);
  fx.monHit=Math.max(0,fx.monHit-dt);fx.partyHit=Math.max(0,fx.partyHit-dt);fx.swing=Math.max(0,fx.swing-dt);
  // party
  const resting=S.resting>0,n=S.party.length;
  S.party.forEach((a,i)=>{const col=i%2,row=Math.floor(i/2);
    const x=Math.round(PW*0.08+col*p*13+row*p*4),y=Math.round(floorY-p*13-row*p*3+col*p*2);
    const bob=reduce||resting?0:(Math.sin(ts*6+i)>0?p:0);const lunge=!reduce&&fx.swing>0&&!resting?p*2:0;const shake=fx.partyHit>0&&!reduce?(Math.random()-.5)*p*2:0;
    cx.globalAlpha=resting?0.45:1;hero(cx,x+lunge+shake,y-bob,p,a,!reduce&&Math.sin(ts*8+i)>0);cx.globalAlpha=1;});
  if(resting){cx.fillStyle='#fff';cx.font=`${p*5}px DotGothic16, monospace`;cx.fillText('Zzz',Math.round(PW*0.12),Math.round(floorY-p*26)-(reduce?0:Math.floor(ts*2)%3*p));}
  // monster
  const m=S.mon;
  if(m&&n){const sc=m.boss?Math.round(p*1.6):p;const mx=Math.round(PW*0.72)+(fx.monHit>0&&!reduce?(Math.random()-.5)*p*3:0);
    cx.save();if(fx.monHit>0){cx.globalAlpha=0.6;}monsterArt(cx,mx,floorY,sc,m,ts);cx.restore();}
  // floaters
  cx.font=`${p*5}px DotGothic16, monospace`;cx.textAlign='center';
  for(let j=fx.hits.length-1;j>=0;j--){const h=fx.hits[j];h.age+=dt;if(h.age>0.9||reduce){fx.hits.splice(j,1);continue;}
    const isM=h.t==='m',isG=h.t==='g';const x=isM||isG?PW*0.72+(h.x-.5)*PW*0.12:PW*0.18+(h.x-.5)*PW*0.1;const y=floorY-p*(isG?30:22)-h.age*p*14;
    cx.globalAlpha=1-h.age/0.9;cx.fillStyle=isG?'#ffd34a':isM?(h.crit?'#ff8fb1':'#fff'):'#ff6b5a';cx.fillText((isG?'+':'')+fmt(h.v)+(h.crit?'!':''),x,y);}
  cx.globalAlpha=1;cx.textAlign='left';
  if(!n){cx.fillStyle='#fff';cx.font=`${p*5}px DotGothic16, monospace`;cx.textAlign='center';cx.fillText('The dungeon waits. Hire a party.',PW/2,floorY*0.5);cx.textAlign='left';}
}

/* ================= boot ================= */
function boot0(){D=derive();if(!S.party.length&&S.stats.recruits===0&&!S.regionOffer){S.party.push(makeAdv(1,'swordsman'));S.party[0].name='Ren';log('The Starfall Guild opens its doors. <b>Ren</b> signs up first.');}
  D=derive();if(!S.board.length)refreshBoard();if(!S.php)S.php=D.pmax;spawn();}
let started=false;
function start(data){
  if(started)return;started=true;let away=null;
  if(data&&data.S){S=merge(data.S);D=derive();}else{const o=load();S=merge(o);D=derive();if(o)away=offline((now()-(S.last||now()))/1000);}
  boot0();S.last=now();
  if(window.claude&&window.claude.hot&&window.claude.hot.snapshot){try{window.claude.hot.snapshot(()=>({S:JSON.parse(JSON.stringify(S))}));}catch(e){}}
  resize();renderTab(true);updateUI();
  if(away&&away.gain>0&&!S.regionOffer)openModal('offline','Welcome back',offlineHTML(away));
  let lastT=performance.now(),uiT=0;
  setInterval(()=>{const t=performance.now(),dt=(t-lastT)/1000;lastT=t;
    if(dt>60){const r=offline(dt);if(r&&r.gain>0&&!modalKind)openModal('offline','Welcome back',offlineHTML(r));}else advance(dt);
    uiT+=dt;if(uiT>=0.2){uiT=0;updateUI();}},100);
  setInterval(save,10000);addEventListener('beforeunload',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
  requestAnimationFrame(frame);
}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
else start(window.claude&&window.claude.hot&&window.claude.hot.data||{});
})();
</script>
