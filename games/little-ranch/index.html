<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Little Ranch · Idle Arcade</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#8fd0f0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none}
#lock{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));width:48px;height:48px;border-radius:50%;border:0;padding:0;
  background:rgba(255,255,255,.35);touch-action:none;cursor:pointer}
#lock svg{width:48px;height:48px;display:block}
#grown{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,24,40,.55);font:600 18px system-ui,sans-serif}
#grown[hidden]{display:none}
#grown .box{background:#fff8ec;color:#3a2a20;border-radius:18px;padding:18px;display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));gap:12px;max-width:92vw}
#grown button,#grown a{min-height:72px;border:0;border-radius:14px;background:#f2c14e;color:#3a2a20;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;cursor:pointer}
#grown .ic{font-size:28px;line-height:1}#grown .alt{background:#e6dccb}
</style></head>
<body>
<canvas id="ranch" role="img" aria-label="A baby Cindercub in a sunny ranch corner, with a food bowl, a sponge and a bush"></canvas>
<button id="lock" aria-label="Grown-ups: hold for three seconds"><svg viewBox="0 0 48 48" aria-hidden="true">
  <circle cx="24" cy="24" r="19" fill="none" stroke="rgba(60,60,90,.25)" stroke-width="4"/>
  <circle id="lockRing" cx="24" cy="24" r="19" fill="none" stroke="#f2c14e" stroke-width="4" stroke-dasharray="119.4" stroke-dashoffset="119.4" transform="rotate(-90 24 24)"/>
  <path d="M17 23v-4a7 7 0 0 1 14 0v4" fill="none" stroke="rgba(60,60,90,.55)" stroke-width="3"/><rect x="14" y="22" width="20" height="14" rx="3" fill="rgba(60,60,90,.55)"/></svg></button>
<div id="grown" hidden role="dialog" aria-label="For grown-ups"><div class="box">
  <button id="gNew"><span class="ic">☀</span>New visit</button>
  <button id="gSound"><span class="ic">♪</span><span id="gSoundLabel">Sound on</span></button>
  <a id="gHome" href="../../index.html"><span class="ic">⌂</span>Back to the arcade</a>
  <button id="gClose" class="alt"><span class="ic">✕</span>Back to play</button>
</div></div>
<script src="game.js"></script>
</body></html>
