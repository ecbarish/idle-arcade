<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wildbond</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<div class="app">
  <header class="top">
    <div class="brand"><a class="home" href="../../index.html">← Arcade</a><h1>Wildbond</h1></div>
    <div class="chips">
      <span class="chip">Coins <b id="coins">0</b></span><span class="chip">Lures <b id="lures">0</b></span><span class="chip">Badges <b id="badges">0</b></span>
      <span class="version-label" style="font-size:12px;color:var(--dim);margin:0 4px;">v1.5.1</span>
      <button class="snd" data-act="sound" id="sndBtn" aria-pressed="false">Sound: off</button>
      <button class="snd" data-act="view" id="viewBtn" title="How much of the world you see (V)">View: Close</button>
      <div class="feedback-container"><button class="snd" aria-haspopup="true" aria-expanded="false" style="padding:4px 10px;">Feedback</button></div>
      <button class="tgl" data-act="auto" id="autoBtn" aria-pressed="false"><span class="sw"></span>Auto-explore</button>
    </div>
  </header>
  <main class="grid">
    <section class="left">
      <div class="scene"><canvas id="scene" aria-label="Your team in the wild"></canvas></div>
      <div class="panel" id="panel"></div>
      <div class="blog" id="blog" hidden></div>
    </section>
    <section class="right">
      <nav class="tabs" role="tablist" aria-label="Menus">
        <button role="tab" data-act="tab" data-arg="team">Team</button>
        <button role="tab" data-act="tab" data-arg="ranch">Ranch</button>
        <button role="tab" data-act="tab" data-arg="dex">Wilddex</button>
        <button role="tab" data-act="tab" data-arg="journal">Journal</button>
      </nav>
      <div class="tabbody" id="tabbody"></div>
    </section>
  </main>
</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
