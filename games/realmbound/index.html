<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Realmbound</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: a classic MMO screen. Left = the world (zone banner, scene, unit frames, action bar, XP bar, combat log);
   right = the game menus in tabs. Dark stone with bronze trim, gold engraved headings, rarity-colored loot. */
:root{
  --bg:#0f0d0a; --stone:#1b1712; --stone2:#241e17; --stone3:#2e261c; --bronze:#8a6a35; --bronze-d:#5a4422;
  --gold:#f2c14e; --fg:#e9e1cf; --muted:#a89a80; --dim:#6f6452;
  --hp:#2fbf3b; --mana:#2f6fe0; --rage:#d0312d; --energy:#e8c62a; --xp:#8c3fd1; --rested:#3a8bff;
  --q0:#9d9d9d; --q1:#ffffff; --q2:#1eff00; --q3:#3a8bff; --q4:#b55cf0; --q5:#ff8000;
  --con-gray:#8e8e8e; --con-green:#3fd44a; --con-yellow:#f5e050; --con-orange:#ff8a2a; --con-red:#ff3b30;
  --concord:#4f7fe0; --wild:#d24a3a;
  --f-head:'IM Fell English SC', 'Palatino Linotype', Georgia, serif;
  --f-body:'Alegreya Sans', 'Segoe UI', system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4;
  background-image:radial-gradient(ellipse at 50% 0,#2a2117 0,transparent 70%)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:12px 40px;display:flex;flex-direction:column;gap:12px}
.frame{background:var(--stone);border:2px solid var(--bronze-d);border-radius:8px;box-shadow:inset 0 0 0 1px #000,0 2px 10px rgba(0,0,0,.5);min-width:0}
h2,h3{font-family:var(--f-head);font-weight:400;color:var(--gold);margin:0;letter-spacing:.02em}
.g{color:#ffd24a} .s{color:#d8d8e0} .c{color:#d08a4a}
.q0{color:var(--q0)} .q1{color:var(--q1)} .q2{color:var(--q2)} .q3{color:var(--q3)} .q4{color:var(--q4)} .q5{color:var(--q5)}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 14px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-head);font-weight:400;font-size:30px;margin:0;color:var(--gold);text-shadow:0 2px 0 #000}
.home{color:var(--muted);text-decoration:none;font-size:13px}
.home:hover{color:var(--gold)}
.who{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:14px}
.crest{display:inline-block;width:12px;height:12px;border-radius:2px;transform:rotate(45deg);margin-right:6px}

/* layout */
.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:12px;align-items:start}
.world{display:flex;flex-direction:column;gap:10px;padding:10px;min-width:0}
.zonebar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.zonebar h2{font-size:24px}
.zsub{color:var(--muted);font-size:13px}
.zbtns{display:flex;gap:6px;flex-wrap:wrap}
.scene{position:relative;aspect-ratio:16/7;max-width:100%;border:1px solid var(--bronze-d);border-radius:6px;overflow:hidden;background:#223}
.scene canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
.statusline{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-weight:700;font-size:14px;text-shadow:0 1px 3px #000;pointer-events:none}
.errtext{position:absolute;left:0;right:0;top:8px;text-align:center;color:#ff3b30;font-weight:800;text-shadow:0 1px 2px #000;pointer-events:none;font-size:15px}

/* unit frames */
.units{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.unit{display:grid;grid-template-columns:50px minmax(0,1fr);gap:8px;align-items:center;background:var(--stone2);border:1px solid var(--bronze-d);border-radius:30px 8px 8px 30px;padding:5px 10px 5px 5px;min-width:0}
.unit.target{grid-template-columns:minmax(0,1fr) 50px;border-radius:8px 30px 30px 8px;padding:5px 5px 5px 10px}
.portrait{width:50px;height:50px;border-radius:50%;border:2px solid var(--bronze);background:#000;position:relative;display:grid;place-items:center;font-family:var(--f-head);font-size:22px;color:var(--fg);overflow:hidden}
.portrait.elite{border-color:var(--gold);box-shadow:0 0 0 2px #6b4b10,0 0 10px rgba(242,193,78,.6)}
.lvl{position:absolute;bottom:-1px;right:-1px;background:#000;border:1px solid var(--bronze);border-radius:50%;width:20px;height:20px;font-size:11px;display:grid;place-items:center;font-family:var(--f-body);font-weight:800}
.uname{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{position:relative;height:14px;background:#000;border:1px solid #3a3022;border-radius:2px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;transition:width .12s linear}
.bar span{position:absolute;inset:0;font-size:11px;font-weight:800;display:grid;place-items:center;text-shadow:0 1px 1px #000}
.b-hp i{background:linear-gradient(#45d64f,#1f8a28)} .b-mana i{background:linear-gradient(#4f8cff,#1f4fb0)}
.b-rage i{background:linear-gradient(#ef4a44,#8f1d1a)} .b-energy i{background:linear-gradient(#f3d64a,#a88d10)}
.b-cast i{background:linear-gradient(#f2c14e,#a5781a)}
.cps{display:flex;gap:3px;margin-top:3px;height:8px}
.cps b{width:14px;height:8px;border-radius:2px;background:#3a2b10;border:1px solid #6b5020}
.cps b.on{background:#ffcf3a}

/* action bar */
.abar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--stone2);border:1px solid var(--bronze-d);border-radius:8px;padding:8px}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.ab{position:relative;width:54px;height:54px;border:2px solid var(--bronze);border-radius:6px;background:linear-gradient(#3a2f22,#18130d);padding:0;overflow:hidden;display:grid;place-items:center;text-align:center}
.ab .ic{font-family:var(--f-head);font-size:13px;line-height:1.05;padding:2px;color:var(--fg)}
.ab .key{position:absolute;top:1px;left:4px;font-size:11px;font-weight:800;color:var(--muted)}
.ab .cd{position:absolute;inset:0;background:conic-gradient(rgba(0,0,0,.72) var(--p,0%),transparent 0);pointer-events:none}
.ab .cdn{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:16px;text-shadow:0 1px 2px #000;pointer-events:none}
.ab.nores .ic{color:#6d8bd6}
.ab.unusable{filter:grayscale(.8) brightness(.6)}
.ab.react{border-color:#ffe36a;box-shadow:0 0 12px #ffd23a;animation:pulse .6s ease-in-out infinite alternate}
.ab.locked{opacity:.35}
@keyframes pulse{to{box-shadow:0 0 22px #ffd23a}}
.mode{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.seg{display:inline-flex;border:2px solid var(--bronze);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--stone3);padding:6px 14px;font-weight:800}
.seg button.on{background:var(--gold);color:#2a1d00}
.modehint{font-size:12px;color:var(--muted);text-align:right;max-width:34ch}
.engaged{color:#7cf08a;font-weight:800}

/* xp */
.xp{position:relative;height:16px;background:#000;border:1px solid var(--bronze-d);border-radius:3px;overflow:hidden}
.xp i{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(#a65be8,#5e1f99)}
.xp em{position:absolute;top:0;bottom:0;background:rgba(58,139,255,.45);border-right:2px solid #3a8bff}
.xp span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:800;text-shadow:0 1px 2px #000}
.xpticks{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(5% - 1px),rgba(0,0,0,.6) calc(5% - 1px) 5%)}

/* loot + log */
.lootwin{background:var(--stone2);border:1px solid var(--gold);border-radius:6px;padding:8px 10px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.lootwin ul{list-style:none;margin:0;padding:0;font-size:14px}
.log{background:rgba(0,0,0,.45);border:1px solid #2a2218;border-radius:6px;padding:6px 10px;font-size:13px;height:118px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l-hit{color:#e9e1cf} .l-crit{color:#ffd24a} .l-hurt{color:#ff8a7a} .l-sys{color:#ffe36a} .l-xp{color:#b48cff} .l-loot{color:#7cf08a} .l-heal{color:#7cf08a} .l-pet{color:#d9f7a8} .l-say{color:#8fd0ff} .l-party{color:#cfe3ff} .l-warn{color:#ff8a2a;font-weight:800}

/* menus */
.menu{min-width:0}
.tabs{display:flex;gap:2px;flex-wrap:wrap;padding:8px 8px 0;border-bottom:2px solid var(--bronze-d)}
.tabs button{background:var(--stone2);border:1px solid var(--bronze-d);border-bottom:0;border-radius:6px 6px 0 0;padding:6px 11px;font-weight:700;color:var(--muted);display:flex;gap:5px;align-items:center}
.tabs button[aria-selected="true"]{background:var(--stone3);color:var(--gold)}
.badge{background:#c0392b;color:#fff;border-radius:999px;font-size:11px;padding:0 6px;font-weight:800}
.tb{padding:12px 14px}
.tb h3{font-size:20px;margin-bottom:4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 10px;max-width:62ch}
h4{margin:14px 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.btn{background:linear-gradient(#5a1e12,#33100a);border:1px solid var(--bronze);border-radius:5px;padding:5px 12px;font-weight:800;color:#ffd890}
.btn:hover:not(:disabled){border-color:var(--gold)}
.btn:disabled{opacity:.4;cursor:default}
.btn.sm{padding:2px 8px;font-size:13px}
.btn.alt{background:var(--stone3);color:var(--fg)}
.btn.armed{background:#8f1d1a;color:#fff}
.rowl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #2a2218}
.rowl:last-child{border-bottom:0}
.rowl .l{min-width:0}
.rowl .r{display:flex;gap:6px;flex-shrink:0;align-items:center}
.meta{font-size:12.5px;color:var(--muted)}
.qtitle{font-weight:800;color:#ffd24a}
.qtitle.done{color:#7cf08a}
.qtext{font-size:13px;color:#d5c9ac;font-style:italic;margin:2px 0}
.prog{font-size:13px}
.pill{font-size:11px;font-weight:800;padding:0 6px;border-radius:4px;border:1px solid currentColor}
.slotrow{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid #2a2218}
.slotrow .sl{font-size:12px;color:var(--muted);text-transform:capitalize}
.item{cursor:help;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:4px 16px;font-size:14px}
.stats div{display:flex;justify-content:space-between;border-bottom:1px dotted #3a3022}
.tal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #2a2218}
.rank{font-weight:800;color:#7cf08a;font-size:13px}
.tgl{width:42px;height:22px;border-radius:999px;border:1px solid var(--bronze);background:#000;position:relative;padding:0}
.tgl::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--dim);transition:left .12s}
.tgl[aria-pressed="true"]{background:#1f5a24}
.tgl[aria-pressed="true"]::after{left:22px;background:#7cf08a}
textarea{width:100%;min-height:60px;background:#000;color:var(--fg);border:1px solid var(--bronze-d);border-radius:4px;font-size:11px;padding:6px}

/* tooltip */
.tip{position:fixed;z-index:50;max-width:290px;background:rgba(8,10,24,.96);border:1px solid #6a7aa8;border-radius:5px;padding:8px 10px;font-size:13.5px;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.6)}
.tip .tn{font-weight:800;font-size:15px}
.tip .gold{color:#ffd24a}
.tip .up{color:#7cf08a} .tip .down{color:#ff6a5a}

/* modal + create */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.sheet{max-width:860px;width:100%;max-height:calc(100% - 32px);overflow:auto;padding:18px}
.sheet h2{font-size:30px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:8px 0 14px}
.choice{text-align:left;background:var(--stone2);border:2px solid var(--bronze-d);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:4px}
.choice:hover{border-color:var(--bronze)}
.choice.on{border-color:var(--gold);background:#2d2414}
.choice b{font-family:var(--f-head);font-weight:400;font-size:19px;color:var(--gold)}
.choice span{font-size:13px;color:var(--muted)}
.nameinp{background:#000;border:1px solid var(--bronze);border-radius:4px;color:var(--fg);padding:6px 10px;font-size:16px;font-weight:700;width:220px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:10px;flex-wrap:wrap}
.toasts{position:fixed;left:50%;transform:translateX(-50%);top:14px;display:flex;flex-direction:column;gap:6px;z-index:45;pointer-events:none;align-items:center}
.toast{background:rgba(0,0,0,.8);border:1px solid var(--bronze);border-radius:6px;padding:6px 14px;font-weight:800;color:#ffe36a;text-shadow:0 1px 2px #000;animation:tin .25s ease-out}
.toast.ding{font-family:var(--f-head);font-weight:400;font-size:26px;color:var(--gold);border-color:var(--gold)}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}}

/* pets */
.petframe{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--stone2);border:1px solid var(--bronze-d);border-radius:8px;padding:5px 10px}
.petframe .pn{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.petframe .bar{height:10px;margin-top:2px}
.petframe .mood{font-size:12px;font-weight:800;white-space:nowrap}
.tamebtn{margin-top:4px;background:linear-gradient(#2f5a1e,#163010);border:1px solid #7cf08a;border-radius:5px;color:#c8ffc8;font-weight:800;padding:2px 10px;font-size:13px}
.r0{color:#d8d8d8} .r1{color:var(--q2)} .r2{color:var(--q3)} .r3{color:var(--q4)} .r4{color:var(--q5)} .r5{color:#ff4f8b}
.petcard{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:start;background:var(--stone2);border:1px solid var(--bronze-d);border-radius:8px;padding:10px}
.petcard canvas{width:96px;height:72px;image-rendering:pixelated;background:#11161a;border:1px solid var(--bronze-d);border-radius:4px}
.petname{font-family:var(--f-head);font-size:22px;line-height:1.1}
.mini{height:10px;background:#000;border:1px solid #3a3022;border-radius:2px;overflow:hidden;margin:3px 0 6px}
.mini i{display:block;height:100%}
.traits{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.trait{font-size:12px;border:1px solid var(--bronze-d);border-radius:4px;padding:0 6px;background:var(--stone3)}
.rarlegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;font-weight:800}
.petinp{background:#000;border:1px solid var(--bronze);border-radius:4px;color:var(--fg);padding:2px 6px;font-weight:700;width:140px}

/* party + people */
.party{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.pm{background:var(--stone2);border:1px solid var(--bronze-d);border-radius:6px;padding:4px 8px;min-width:0}
.pm .pn{font-weight:800;font-size:13px;display:flex;justify-content:space-between;gap:6px;white-space:nowrap;overflow:hidden}
.pm .role{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pm .bar{height:9px;margin-top:2px}
.pm.dead{opacity:.45}
.enccard{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:linear-gradient(90deg,#1c2a3a,var(--stone2));border:1px solid #6a8ab0;border-radius:8px;padding:7px 10px}
.enccard .who2{font-size:14px}
.enccard .who2 b{font-family:var(--f-head);font-weight:400;font-size:18px}
.enccard .acts2{display:flex;gap:6px;flex-wrap:wrap}
.ab.special{width:auto;min-width:86px;padding:0 10px;border-color:#7cf08a}
.ab.special .ic{font-family:var(--f-body);font-weight:800;font-size:13px}
.ab.dodge{border-color:#ff8a2a;box-shadow:0 0 14px #ff8a2a;animation:pulse .4s ease-in-out infinite alternate}
.ab.combo{border-color:#8fd0ff;box-shadow:0 0 14px #8fd0ff;animation:pulse .5s ease-in-out infinite alternate}
.aff{height:6px;background:#000;border:1px solid #3a3022;border-radius:2px;overflow:hidden;margin-top:3px;max-width:220px}
.aff i{display:block;height:100%;background:linear-gradient(90deg,#8fd0ff,#b55cf0)}
.lfgrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--bronze-d);border-radius:6px;margin-bottom:5px;background:var(--stone2);text-align:left;width:100%}
.lfgrow.on{border-color:var(--gold);background:#2d2414}

@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.units{grid-template-columns:1fr}.ab{width:46px;height:46px}.ab .ic{font-size:11px}}
@media (prefers-reduced-motion:reduce){.ab.react{animation:none}.toast{animation:none}.bar i{transition:none}}
</style>

<div class="app" id="app">
  <header class="frame top">
    <div class="brand"><h1>Realmbound</h1><a class="home" href="../../index.html">← Arcade</a><button class="btn sm alt" data-act="chars">Characters</button></div>
    <div class="who" id="who"></div>
  </header>

  <div class="grid">
    <section class="frame world">
      <div class="zonebar">
        <div><h2 id="zoneName">Thornvale</h2><div class="zsub" id="zoneSub"></div></div>
        <div class="zbtns" id="zoneBtns"></div>
      </div>
      <div class="scene"><canvas id="scene" aria-label="Your hero in the world"></canvas><div class="errtext" id="err"></div><div class="statusline" id="status"></div></div>
      <div class="units">
        <div class="unit" id="pframe">
          <div class="portrait" id="pPort">?<span class="lvl" id="pLvl">1</span></div>
          <div style="min-width:0"><div class="uname" id="pName"></div>
            <div class="bar b-hp"><i id="pHp"></i><span id="pHpT"></span></div>
            <div class="bar" id="pResBar"><i id="pRes"></i><span id="pResT"></span></div>
            <div class="cps" id="pCps" hidden><b></b><b></b><b></b><b></b><b></b></div></div>
        </div>
        <div class="unit target" id="tframe">
          <div style="min-width:0;text-align:right"><div class="uname" id="tName">No target</div>
            <div class="bar b-hp"><i id="tHp"></i><span id="tHpT"></span></div>
            <div class="bar b-cast" id="castBar" hidden><i id="castI"></i><span id="castT"></span></div>
            <button class="tamebtn" data-act="tame" id="tameBtn" hidden>Tame Beast</button></div>
          <div class="portrait" id="tPort">–<span class="lvl" id="tLvl">?</span></div>
        </div>
      </div>
      <div class="party" id="partyframes" hidden></div>
      <div class="enccard" id="enccard" hidden><div class="who2" id="encText"></div><div class="acts2" id="encActs"></div></div>
      <div class="petframe" id="petframe" hidden>
        <span class="pn" id="pfName"></span>
        <div class="bar b-hp"><i id="pfHp"></i><span id="pfHpT"></span></div>
        <span class="mood" id="pfMood"></span>
      </div>
      <div class="lootwin" id="lootwin" hidden><ul id="lootList"></ul><button class="btn" data-act="loot">Loot all (L)</button></div>
      <div class="abar">
        <div class="slots" id="slots"></div>
        <div class="slots"><button class="ab special combo" data-act="combo" id="comboBtn" hidden><span class="key">C</span><span class="ic" id="comboTxt">Combo</span></button>

function genItem(ilvl,rar,slot,o){
  o=o||{};ilvl=Math.max(1,Math.round(ilvl));const cls=o.cls||pick(Object.keys(CLASSES));const K=CLASSES[cls];
  const it={id:uid(),slot,ilvl,rar,stats:{},dur:100};const tier=Math.min(3,Math.floor((ilvl-1)/5));let base;
  if(slot==='weapon'){const type=o.type||pick(K.weap),W=WEAPONS[type];it.wtype=type;it.speed=W.speed;
    const dps=(ilvl*.7+2.5)*[.8,1,1.15,1.3,1.5][rar];it.wmin=Math.max(1,Math.round(dps*W.speed*.8));it.wmax=Math.round(dps*W.speed*1.2)+1;base=W.names[tier];}
  else if(slot==='offhand'){const type=o.type||K.off;it.otype=type;base=OFFH[type][tier];if(type==='shield')it.armor=Math.round(8*(ilvl*2+5)*[.8,1,1.1,1.25,1.4][rar]);}
  else if(slot==='trinket'){base=TRINKETS[tier];if(rar<2)rar=it.rar=2;}
  else{const at=o.atype||K.armor[0];it.atype=at;base=`${MAT[at][tier]} ${pick(PIECE[at][slot])}`;it.armor=Math.round(ARM_MULT[at]*SLOT_MULT[slot]*(ilvl*2+5)*[.8,1,1.1,1.25,1.4][rar]);}
  if(rar>=2){const budget=Math.max(2,Math.round((ilvl*.55+1.5)*(rar===2?1:1.45)*(slot==='trinket'?1.2:1)));
    if(rar===2){const sfx=o.suffix||(o.cls?pick(CLASS_SFX[cls]):pick(Object.keys(SUFFIX)));const [a,b]=SUFFIX[sfx][1];const x=Math.ceil(budget/2);
      it.stats[a]=x;it.stats[b]=(it.stats[b]||0)+Math.max(1,budget-x);it.name=`${base} of the ${SUFFIX[sfx][0]}`;}
    else{const pr=PRIMARY[cls];it.stats[pr[0]]=Math.ceil(budget*.45);it.stats.sta=Math.ceil(budget*.35);it.stats[pr[1]]=(it.stats[pr[1]]||0)+Math.max(1,Math.round(budget*.25));it.name=o.name||`${pick(BLUE_PRE)} ${base}`;}
  }else it.name=o.name||base;
  it.value=Math.max(1,Math.round(Math.pow(ilvl+2,1.7)*[1,2,5,12,30][it.rar]*(slot==='weapon'?1.4:1)));
  return it;
}

  if(C.errT>0)C.errT-=h;C.anim.hero=Math.max(0,C.anim.hero-h);C.anim.mob=Math.max(0,C.anim.mob-h);
  const K=CLASSES[he.cls],mana=K.res==='mana';
  // resource regen
  if(K.res==='energy')C.res=Math.min(100,C.res+10*(1+T('energyRegen')/100)*h);
  if(K.res==='rage'&&C.phase!=='fight')C.res=Math.max(0,C.res-3*h);
  switch(C.phase){
    case 'seek':C.t-=h;C.hp=Math.min(ST.hpMax,C.hp+ST.hpMax*.01*h);if(mana)C.res=Math.min(ST.resMax,C.res+ST.resMax*.02*h);if(C.t<=0)spawn();break;
    case 'rest':{C.hp=Math.min(ST.hpMax,C.hp+ST.hpMax*.07*h);if(mana)C.res=Math.min(ST.resMax,C.res+ST.resMax*.07*h);
      const p=petOf(),petOk=!p||p.hp<=0?!(p&&C.reviving>0):p.hp>=petStats(p).hpMax*.9;
      const partyOk=C.party.every(q=>q.dead||q.hp>=compStats(q.n).hpMax*.9);
      if(C.hp>=ST.hpMax*.97&&(!mana||C.res>=ST.resMax*.95)&&petOk&&partyOk){C.phase='seek';C.t=he.dun?4:travel(2.5);}break;}
    case 'loot':C.t-=h;if(C.t<=0){

      if(C.loot&&aiOn()&&C.loot.money)takeLoot({money:C.loot.money,items:[]},false);if(C.loot&&C.loot.items.length)line('The corpse decays. Some loot was left behind.','l-hurt');afterFight();}break;
    case 'dead':C.t-=h;if(C.t<=0){C.hp=ST.hpMax*.5;if(mana)C.res=ST.resMax*.5;C.phase='rest';line('You return to your body.','l-sys');}break;
    case 'town':C.t-=h;if(C.t<=0){C.phase='intown';line(`You arrive at ${hubName()}.`,'l-sys');
        if(he.addons.unl.sweep&&he.addons.on.sweep)sellJunk(true);if(he.addons.unl.petcare&&he.addons.on.petcare&&he.bags.filter(i=>i.food).length<3)buyFood(true);C.townT=3;}break;
    case 'intown':if(aiOn()){C.townT-=h;if(C.townT<=0){repairAll(true);leaveTown();}}break;

  if(C.phase!=='fight')for(const q of C.party){if(q.dead)continue;const mx=compStats(q.n).hpMax;q.hp=Math.min(mx,q.hp+mx*(C.phase==='rest'?.08:.02)*h);}
  if(C.enc){C.enc.t-=h;if(C.enc.t<=0||he.dun)C.enc=null;}

    if(a>b){toast(`${mt.name} is now ${MOUNT_TRAIN[a].n}`);slog(`${mt.name} reached ${MOUNT_TRAIN[a].n} training.`);}}}
  if(C.phase!=='fight'&&C.cast)C.cast=null;
  C.anim.pet=Math.max(0,(C.anim.pet||0)-h);
}
/* ---- party combat ---- */
function syncParty(){const h=H();C.party=(h.party||[]).map(id=>{const n=npcOf(id);if(!n)return null;const old=(C.party||[]).find(p=>p.id===id);
  return old?Object.assign(old,{n}):{id,n,hp:compStats(n).hpMax,swing:1+R(),healT:1.5,dead:false};}).filter(Boolean);}
function partyAlive(){return (C&&C.party||[]).filter(p=>!p.dead);}
function hasRole(r){return partyAlive().some(p=>ROLE_OF[p.n.cls]===r);}
function compsAct(h){
  for(const p of C.party){if(p.dead)continue;const s=compStats(p.n);
    p.swing-=h;if(p.swing<=0&&C.mob){p.swing=2;let a=s.dps*2*(.85+R()*.3)*(C.buffs.pack?1.2:1)*(C.mob.marked>0?1.1:1);const crit=R()<.1;if(crit)a*=2;a=Math.max(1,Math.round(a*.85));
      C.mob.hp-=a;fx(String(a)+(crit?'!':''),crit?'#ffd24a':'#cfe3ff','mob',crit);if(crit||R()<.25)line(`${p.n.name} ${crit?'crits':'hits'} ${C.mob.name} for ${a}.`,'l-party');
      if(C.mob.hp<=0){onKill();return;}}
    if(s.role==='heal'){p.healT-=h;if(p.healT<=0){p.healT=2.5;healLowest(s.hps*2.5,p.n.name);}}}
}
function healLowest(amount,who){
  const opts=[{k:'hero',pct:C.hp/ST.hpMax}];for(const p of partyAlive())opts.push({k:p,pct:p.hp/compStats(p.n).hpMax});
  const pet=petOf();if(pet&&pet.hp>0)opts.push({k:'pet',pct:pet.hp/petStats(pet).hpMax});
  opts.sort((a,b)=>a.pct-b.pct);const t=opts[0];if(t.pct>=.98)return;const a=Math.round(amount);
  if(t.k==='hero'){C.hp=Math.min(ST.hpMax,C.hp+a);fx('+'+a,'#7cf08a','hero');line(`${who} heals you for ${a}.`,'l-heal');}
  else if(t.k==='pet'){pet.hp=Math.min(petStats(pet).hpMax,pet.hp+a);fx('+'+a,'#7cf08a','pet');}
  else{t.k.hp=Math.min(compStats(t.k.n).hpMax,t.k.hp+a);fx('+'+a,'#7cf08a','party');if(R()<.3)line(`${who} heals ${t.k.n.name===who?'themselves':t.k.n.name} for ${a}.`,'l-heal');}
}
function pickTarget(){
  const opts=[],tankUp=hasRole('tank');opts.push({k:'hero',w:H().cls==='warrior'?(tankUp?2:6):1});
  const pet=petOf();if(pet&&pet.hp>0)opts.push({k:'pet',w:petStats(pet).taunt*4});
  for(const p of partyAlive()){const r=ROLE_OF[p.n.cls];opts.push({k:p,w:r==='tank'?8:r==='heal'?1.3:1});}
  let r=R()*opts.reduce((s,o)=>s+o.w,0);for(const o of opts){r-=o.w;if(r<=0)return o.k;}return 'hero';
}
function hitComp(p,raw){const s=compStats(p.n);let a=raw*(1-s.armor/(s.armor+400+85*C.mob.lvl))*(C.buffs.bulwark?.7:1);a=Math.max(1,Math.round(a));
  p.hp-=a;fx('-'+a,'#ffb38a','party');if(p.hp<=0){p.hp=0;p.dead=true;line(`${p.n.name} has fallen!`,'l-hurt');}}
function hitPet(raw){const pp=petOf(),ps=petStats(pp);let a=raw*(1-ps.armor/(ps.armor+400+85*C.mob.lvl))*(C.buffs.bulwark?.7:1);a=Math.max(1,Math.round(a));
  pp.hp-=a;line(`${C.mob.name} hits ${petLabel(pp).replace(/^Your /,'your ')} for ${a}.`,'l-hurt');fx('-'+a,'#ff9a7a','pet');if(pp.hp<=0)petDie();}
/* returns true if the hit killed you */
function hitHero(raw,label){const m=C.mob,he=H();let a=raw*(1-ST.armor/(ST.armor+400+85*m.lvl));const d=m.lvl-he.lvl;if(d>0)a*=1+.04*d;if(C.buffs.bulwark)a*=.7;a=Math.max(1,Math.round(a));
  if(C.absorb>0){const ab=Math.min(C.absorb,a);C.absorb-=ab;a-=ab;if(ab)fx('Absorb','#9cc8ff','hero');}
  if(a>0){C.hp-=a;line(`${label||m.name+' hits you'} for ${a}.`,'l-hurt');fx('-'+a,'#ff6a5a','hero');if(he.cls==='warrior')C.res=Math.min(100,C.res+a/(he.lvl*3+10)*2.5);}
  if(C.hp<=0){const gp=petOf();
    if(gp&&gp.hp>0&&bondLvl(gp)>=4&&!C.guardUsed){C.guardUsed=true;C.hp=Math.round(ST.hpMax*.15);gp.hp=Math.max(1,gp.hp-a);line(`${gp.name} throws itself in front of the blow!`,'l-sys');toast(`${gp.name} saved you`);}
    else{die();return true;}}
  return false;}
function bossWave(m){line(`${m.name} calls ${dungeonDef().waveName}!`,'l-warn');const raw=m.dmg*.8;
  for(const p of partyAlive())hitComp(p,raw*(.9+R()*.2));const pet=petOf();if(pet&&pet.hp>0)hitPet(raw);return hitHero(raw,`The ${dungeonDef().waveName} hits you`);}
function bossSurge(m){const raw=m.dmg*3;
  for(const p of partyAlive()){if(R()>=.45+.1*affLvl(p.n))hitComp(p,raw*.8);}
  if(C.dodged){line(`You dodge ${dungeonDef().surgeName}.`,'l-sys');fx('Dodged!','#7cf08a','hero');return false;}
  return hitHero(raw,`${dungeonDef().surgeName} slams you`);}
function dodgeNow(){if(!(C.win.dodge>0&&C.surge))return;C.dodged=true;C.win.dodge=0;C.lastInput=C.run;line('You brace and leap clear.','l-sys');}
function doCombo(manual){
  const p=C.party.find(x=>x.id===C.comboWith&&!x.dead);if(!p||!(C.win.combo>0)||!C.mob)return;C.win.combo=0;if(manual)C.lastInput=C.run;
  const n=p.n,s=compStats(n),am=1+.15*Math.max(0,affLvl(n)-2),base=(ST.melee?wroll():20+H().lvl*4+ST.sp)*am,ck=COMBO[n.cls];
  line(`Combo with ${n.name}: ${ck.name}!`,'l-sys');toast(`${ck.name}!`);addAff(n,1);
  switch(n.cls){
    case 'warrior':C.buffs.bulwark={t:6};hitMob(base*2+s.dps*6,{sure:1,label:ck.name});break;
    case 'priest':{const pct=.25*am;C.hp=Math.min(ST.hpMax,C.hp+ST.hpMax*pct);for(const q of partyAlive())q.hp=Math.min(compStats(q.n).hpMax,q.hp+compStats(q.n).hpMax*pct);
      const pet=petOf();if(pet&&pet.hp>0)pet.hp=Math.min(petStats(pet).hpMax,pet.hp+petStats(pet).hpMax*pct);fx('+heal','#7cf08a','hero');hitMob(base*1.2,{sure:1,label:ck.name});break;}
    case 'mage':hitMob(base*1.5+s.dps*10,{sure:1,label:ck.name});break;
    case 'rogue':hitMob(base*2.2+s.dps*6,{sure:1,critBonus:100,label:ck.name});break;
    case 'hunter':C.buffs.pack={t:8};hitMob(base*1.3+s.dps*6,{sure:1,label:ck.name});break;
  }
}
function fight(h,mana){
  const m=C.mob,he=H();if(!m){C.phase='seek';C.t=1;return;}
  C.fightT+=h;
  if(mana)C.res=Math.min(ST.resMax,C.res+ST.st.spi*(C.fightT-C.lastCast>5?.1:.025)*(1+T('regenPct')/100)*h);
  if(m.marked>0)m.marked-=h;
  // taming: the hero channels, the beast keeps attacking
  if(C.taming){C.taming.t-=h;if(C.taming.t<=0){finishTame();return;}}
  // the pet
  const pet=petOf();
  if(pet&&pet.hp>0&&!C.taming){C.petSwing-=h*(C.buffs.frenzy?1.4:1)*(C.buffs.packfury?1.3:1);
    if(C.petSwing<=0){C.petSwing=petStats(pet).speed;petHit(1);if(!C.mob)return;}
    C.petCd-=h;if(C.petCd<=0){petAbility();if(!C.mob)return;}}
  // casting
  if(C.cast){C.cast.t-=h;if(C.cast.t<=0){const a=C.cast.a;C.cast=null;C.anim.hero=.2;a.fn();if(!C.mob)return;}}
  // auto attack (casters swing only when not casting)
  if(!C.cast&&!C.taming){C.swing-=h*(C.buffs.quicken?1.3:1);if(C.swing<=0){C.swing=ST.w.speed;C.anim.hero=.15;
    hitMob(wroll(),{phys:1,auto:1,label:'Your attack'});if(!C.mob)return;
    if(he.cls==='warrior'&&he.lvl>=6&&R()<.06)openWin('counter',4+T('window'));}}
  // dots
  for(const k in m.dots){const d=m.dots[k];d.t-=h;if(d.t<=0){d.t=3;d.left--;const a=Math.max(1,Math.round(d.per*dmgMods()));m.hp-=a;line(`${m.name} suffers ${a} from ${d.label}.`,'l-hit');fx(String(a),'#e6c35a','mob');
    if(d.left<=0)delete m.dots[k];if(m.hp<=0){onKill();return;}}}
  // companions
  if(C.party.length){compsAct(h);if(!C.mob||C.phase!=='fight')return;}
  // boss mechanics
  if(m.mech){
    if(m.mech.wave){C.waveT-=h;if(C.waveT<=0){C.waveT=m.mech.wave*(m.tidal?.7:1);if(bossWave(m))return;}}
    if(m.mech.surge&&!C.surge){C.surgeT-=h;if(C.surgeT<=0){C.surgeT=m.mech.surge*(m.tidal?.7:1);C.surge={t:2.5};C.dodged=false;openWin('dodge',2.5);
      line(`${m.name} begins to cast ${dungeonDef().surgeName}!`,'l-warn');toast(`${dungeonDef().surgeName}! Press D to dodge`);if(aiOn()&&R()<aiEff()*.75)C.dodged=true;}}
    if(C.surge){C.surge.t-=h;if(C.surge.t<=0){C.surge=null;C.win.dodge=0;if(bossSurge(m))return;}}
    if(m.mech.enrage&&!m.enraged&&C.fightT>m.mech.enrage){m.enraged=true;line(`${m.name} becomes enraged!`,'l-warn');toast(`${m.name} is enraged`);}
  }
  // combined abilities with friends
  const friends=partyAlive().filter(p=>affLvl(p.n)>=2);
  if(friends.length&&!(C.win.combo>0)){C.comboT=(C.comboT===undefined?8:C.comboT)-h;if(C.comboT<=0){C.comboT=14+R()*6;const p=pick(friends);C.comboWith=p.id;openWin('combo',5);say(p.n,'combo');}}
  // mob swing: the enemy picks a target, and tanks draw most attacks
  if(m.chill>0)m.chill-=h;
  m.swing-=h*(m.chill>0?.6:1);
  if(m.swing<=0){m.swing=m.speed;C.anim.mob=-.18;
    const raw=m.dmg*(.85+R()*.3)*(m.raging&&m.hp<m.max*.3?1.4:1)*(m.enraged?2.5:1);const tg=pickTarget();
    if(tg==='pet')hitPet(raw);
    else if(tg!=='hero')hitComp(tg,raw);
    else if(R()*100<ST.dodge){line(`${m.name} attacks. You dodge.`,'l-hit');fx('Dodge','#ccc','hero');if(he.cls==='rogue'&&he.lvl>=6)openWin('riposte',4);}
    else if(ST.melee&&R()<.05){line(`${m.name} attacks. You parry.`,'l-hit');fx('Parry','#ccc','hero');if(he.cls==='rogue'&&he.lvl>=6)openWin('riposte',4);}
    else if(hitHero(raw))return;}

  if(aiOn()&&C.win.combo>0&&C.win.combo_ai)doCombo(false);
  if(!C.mob)return;

  }
}
function hubName(){const z=ZONES[H().zone];return typeof z.hub==='string'?z.hub:z.hub[H().faction];}
function giver(q){return Array.isArray(q.giver)?q.giver[H().faction==='concord'?0:1]:q.giver;}
function goTown(){if(H().dun){err('Leave the dungeon first.');return;}if(C.phase==='fight'){err("You can't leave in the middle of a fight.");return;}C.phase='town';C.t=travel(10);C.mob=null;line('Heading back to town.','l-sys');}
function leaveTown(){C.phase='seek';C.t=travel(6);line('You head back out.','l-sys');}

/* ---- items & vendor ---- */
function equip(id,auto){const h=H(),i=h.bags.findIndex(x=>x.id===id);if(i<0)return;const it=h.bags[i];if(!canEquip(it)){err("You can't use that.");return;}
  const old=h.gear[it.slot];h.bags.splice(i,1);h.gear[it.slot]=it;if(old)h.bags.push(old);h.stats.equips+=auto?0:1;recalc();
  line(`You equip [${it.name}].`,'l-loot');}
function autoEquip(it){if(score(it)>score(H().gear[it.slot]))equip(it.id,true);}
function inTown(){return C.phase==='intown';}
function sellItem(id){if(!inTown()){err('You need to be at a vendor in town.');return;}const h=H(),i=h.bags.findIndex(x=>x.id===id);if(i<0)return;const it=h.bags[i];h.bags.splice(i,1);h.money+=it.value;if(it.junk)h.stats.junkSold++;line(`Sold [${it.name}] for ${moneyTxt(it.value)}.`,'l-loot');}
function sellJunk(auto){const h=H();let n=0,v=0;h.bags=h.bags.filter(it=>{if(it.junk){n++;v+=it.value;return false;}return true;});h.money+=v;if(!auto)h.stats.junkSold+=n;if(n)line(`${auto?'Vendor Sweep sold':'Sold'} ${n} junk item${n>1?'s':''} for ${moneyTxt(v)}.`,'l-loot');}
function repairCost(){const h=H();let c=0;for(const s of SLOTS){const it=h.gear[s];if(it)c+=Math.round(it.value*.12*(100-it.dur)/100);}return c;}
function repairAll(auto){const h=H(),c=repairCost();if(!c)return;if(h.money<c){if(!auto)err("You can't afford that.");return;}h.money-=c;for(const s of SLOTS)if(h.gear[s])h.gear[s].dur=100;recalc();line(`Repaired your gear for ${moneyTxt(c)}.`,'l-loot');}
function meatCost(){return Math.max(5,H().lvl*6);}
function buyFood(auto){const h=H(),c=meatCost()*5;if(!inTown()){if(!auto)err('You need to be at a vendor in town.');return;}if(h.money<c){if(!auto)err("You can't afford that.");return;}
  if(h.bags.length>11){if(!auto)err('Not enough bag space.');return;}h.money-=c;
  for(let i=0;i<5;i++)h.bags.push({id:uid(),food:true,diet:'meat',rar:1,name:'Haunch of Meat',value:Math.round(meatCost()/4)});line(`Bought 5 Haunch of Meat for ${moneyTxt(c)}.`,'l-loot');}

/* ---- quests ---- */
function qState(q){const h=H();if(h.quests.done[q.id])return 'done';if(h.quests.active.includes(q.id))return (h.quests.prog[q.id]||0)>=q.n?'ready':'active';
  if(h.lvl>=q.lvl-2&&(!q.req||h.quests.done[q.req]))return 'avail';return 'locked';}
function qReward(q){const h=H();if(!h.quests.rewards[q.id]){const s1=pick(['head','chest','legs','feet','hands','weapon']);let s2=pick(['head','chest','legs','feet','hands','offhand']);if(s2===s1)s2='trinket';
    h.quests.rewards[q.id]=q.elite?[genItem(q.lvl+2,3,s1,{cls:h.cls}),genItem(q.lvl+2,3,s2==='trinket'?'trinket':s2,{cls:h.cls})]:[genItem(q.lvl+1,2,s1,{cls:h.cls}),genItem(q.lvl+1,2,s2,{cls:h.cls})];}
  return h.quests.rewards[q.id];}
function qXP(q){return Math.round(Math.max(xpNeed(q.lvl)*.18,(q.lvl*5+45)*(4+q.n*.5))*(q.elite?2:1)*(RACES[H().race].qxp||1));}
function qMoney(q){return Math.round((q.lvl*45+20)*(q.elite?3:1));}
function accept(id){const h=H(),q=ALLQ[id];if(qState(q)!=='avail')return;if(h.quests.active.length>=3){err('Your quest log is full (3).');return;}h.quests.active.push(id);h.quests.prog[id]=0;qReward(q);line(`Quest accepted: ${q.name}`,'l-sys');}
function abandon(id){const h=H();h.quests.active=h.quests.active.filter(x=>x!==id);delete h.quests.prog[id];}
function turnIn(id,choice,auto){const h=H(),q=ALLQ[id];if(qState(q)!=='ready')return;const rw=qReward(q)[choice];
  if(rw&&h.bags.length>=16){err('Inventory is full.');return;}
  h.quests.active=h.quests.active.filter(x=>x!==id);h.quests.done[id]=true;h.stats.quests++;
  h.money+=qMoney(q);line(`${q.name} completed. You receive ${moneyTxt(qMoney(q))}.`,'l-sys');gainXP(qXP(q),false);
  if(rw){h.bags.push(rw);line(`You receive [${rw.name}].`,'l-loot');if(h.addons.unl.gearcmp&&h.addons.on.gearcmp)autoEquip(rw);}
  toast(`Quest complete: ${q.name}`);slog(`Completed ${q.name}.`);
  if(q.id==='f10'){toast('The Drowned Sanctum awaits. Find a group in the Friends tab.');slog('Defeated the Drowned Prophet. The Drowned Sanctum awaits.');}
}
function questHelper(){const h=H();
  for(const id of [...h.quests.active]){const q=ALLQ[id];if(qState(q)==='ready'){const rw=qReward(q);const c=score(rw[0])>=score(rw[1])?0:1;turnIn(id,c,true);}}
  if(h.quests.active.length<3){for(const z of ZONE_ORDER[h.faction]){for(const q of QUESTS[z]){if(h.quests.active.length>=3)break;if(z!==h.zone)continue;if(qState(q)==='avail'&&q.lvl<=h.lvl+1&&!(q.elite&&q.lvl>h.lvl))accept(q.id);}}}
}

const ADDONS=[

function checkAddons(){const h=H();for(const a of ADDONS){if(h.addons.unl[a.id]||(a.cls&&a.cls!==h.cls))continue;const [x,n]=a.prog();if(x>=n){h.addons.unl[a.id]=true;h.addons.on[a.id]=true;h.seenAddons=false;toast(`Addon installed: ${a.name}`);slog(`Earned the ${a.name} addon.`);line(`Addon installed: ${a.name}.`,'l-sys');}}}

/* =================== save / offline =================== */
function save(){S.last=Date.now();const h=H();
  if(h&&C){h.cur={hp:C.hp,res:C.res};h.lastPlayed=Date.now();}
  Arcade.save(KEY,S);
  if(h)Arcade.report('realmbound',{summary:`${h.name}, level ${h.lvl} ${RACES[h.race].name} ${CLASSES[h.cls].name}`,detail:`${ZONES[h.zone].name} · ${S.chars.length} character${S.chars.length>1?'s':''}`});}
/* hunt=false for characters you weren't playing: like a classic logout, they only rest at the inn */
function offline(sec,hunt){
  const h=H();if(!h||sec<60)return null;sec=Math.min(sec,86400);if(hunt===undefined)hunt=true;
  const restedGain=h.lvl<LEVEL_CAP?Math.max(0,Math.min(xpNeed(h.lvl)*1.5-h.rested,sec/3600*xpNeed(h.lvl)*.15)):0;h.rested+=restedGain;
  const kills=hunt?Math.floor(sec*.5/Math.max(8,h.avg.cycle)):0;const lvl0=h.lvl;let xp=0;const money=Math.round(kills*h.avg.money);
  if(kills>0&&h.lvl<LEVEL_CAP){xp=Math.round(kills*h.avg.xp);gainXP(xp,false);}h.money+=money;h.stats.kills+=kills;
  return {sec,kills,xp,money,levels:h.lvl-lvl0,rested:restedGain};
}

function tipHTML(it){
  let h=`<div class="tn q${it.rar}">${it.name}</div>`;
  if(it.junk)return h+`<div>Poor quality. Sell to a vendor.</div><div>Sell price: ${moneyStr(it.value)}</div>`;
  if(it.mountItem){const r=REINS[it.mid];return h+`<div>Mount: ${FAMILIES[r.kind]?FAMILIES[r.kind].name:"Horse"}, ${Math.round(r.base*100)}% base speed.</div><div>Use from your bags to add it to your mounts. Needs Journeyman Riding for full speed.</div>`;}
  if(it.food)return h+`<div>Pet food: ${it.diet==="bread"?"bread (boars eat anything)":"meat"}.</div><div>Feeding makes your pet happier.</div><div>Sell price: ${moneyStr(it.value)}</div>`;
  const slot=it.slot==='offhand'?(it.otype==='shield'?'Off hand · Shield':'Off hand · '+(it.otype==='tome'?'Held in off hand':'Dagger')):it.slot==='weapon'?`Main hand · ${it.wtype[0].toUpperCase()+it.wtype.slice(1)}`:it.slot==='trinket'?'Trinket':`${it.slot[0].toUpperCase()+it.slot.slice(1)} · ${it.atype[0].toUpperCase()+it.atype.slice(1)}`;
  h+=`<div>${slot}</div>`;
  if(it.slot==='weapon')h+=`<div>${it.wmin} - ${it.wmax} Damage · Speed ${it.speed.toFixed(2)}</div><div>(${((it.wmin+it.wmax)/2/it.speed).toFixed(1)} damage per second)</div>`;
  if(it.armor)h+=`<div>${it.armor} Armor</div>`;

  h+=`<div class="${it.dur<=0?'down':''}">Durability ${it.dur}%${it.dur<=0?' (broken)':''}</div><div style="color:var(--gold)">Item level ${it.ilvl}</div>`;
  if(!canEquip(it))h+=`<div class="down">Your class can't use this.</div>`;

}

    case 'enchelp':encAct('help');break;
    case 'encinvite':encAct('invite');break;

const cv=$('#scene'),cx=cv.getContext('2d');let PW=0,PH=0;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){const r=cv.getBoundingClientRect();const d=Math.min(2,devicePixelRatio||1);PW=r.width;PH=r.height;cv.width=Math.round(PW*d);cv.height=Math.round(PH*d);cx.setTransform(d,0,0,d,0,0);cx.imageSmoothingEnabled=false;}
if(window.ResizeObserver)new ResizeObserver(resize).observe(cv);else addEventListener('resize',resize);
function drawHero(x,y,p,t){const h=H(),r=RACES[h.race],K=CLASSES[h.cls];const q=(gx,gy,w,hh,c)=>{cx.fillStyle=c;cx.fillRect(Math.round(x+gx*p),Math.round(y+gy*p),Math.ceil(w*p),Math.ceil(hh*p));};

  if(C.phase==='dead')cx.globalAlpha=.4;

  q(1,5+dy,6,5,K.col);q(1,9+dy,6,1,'#3a2a1a');q(0,6+dy,1,3,K.col);q(7,6+dy,1,3,K.col);
  q(1,1+dy,6,4,r.skin);q(2,3+dy,1,1,'#111');q(5,3+dy,1,1,'#111');q(1,0+dy,6,1,r.hair);q(0,1+dy,1,2,r.hair);q(7,1+dy,1,2,r.hair);
  if(r.beard)q(1,4+dy,6,2,r.hair);if(r.tusks){q(2,4+dy,1,1,'#fff');q(5,4+dy,1,1,'#fff');}if(r.ears){q(-1,2+dy,1,1,r.skin);q(8,2+dy,1,1,r.skin);}

  else if(h.cls==='warrior'||h.cls==='rogue'){q(8,2+dy+sw,1,6,'#dfe6ee');q(7,7+dy,3,1,'#8a5a2b');}else{q(8,-1+dy,1,11,'#8a5a2b');q(7,-2+dy,3,2,h.cls==='mage'?'#69ccf0':'#f2c14e');}
